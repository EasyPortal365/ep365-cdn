name: CDN do Azure

# Obsah repa -> Azure Blob Storage ep365cdnweu ($web) za Azure Front Door (cdn.easyportal365.cz).
# push na main = rozdil od posledniho nasazeni; noc = overeni bajt po bajtu (MD5 v Azure proti gitu);
# rucne = deploy / full / verify / live (stazeni vsech souboru pres HTTP z `base` a porovnani s gitem).
# Prihlaseni bez tajemstvi: federovana identita Entra app "ep365-cdn-deploy" (jen vetev main),
# role Storage Blob Data Contributor jen na storage ucet ep365cdnweu.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = rozdil od posledniho nasazeni, full = dorovnat cely obsah, verify = MD5 v Azure proti gitu, live = HTTP stazeni vseho z base'
        type: choice
        options: [deploy, full, verify, live]
        default: deploy
      base:
        description: 'Jen pro live: adresa CDN (pred prepnutim DNS endpoint Front Dooru)'
        type: string
        default: 'https://cdn.easyportal365.cz'
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cdn-azure
  cancel-in-progress: false

jobs:
  cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_CLIENT_ID: 202cbf1a-efeb-4fa3-9332-037beb703b25
      AZURE_TENANT_ID: 66c95b26-3137-477a-a6fa-e6f2eb255247
      STORAGE_ACCOUNT: ep365cdnweu
      MODE: ${{ github.event_name == 'schedule' && 'verify' || inputs.mode || 'deploy' }}
      LIVE_BASE: ${{ inputs.base || 'https://cdn.easyportal365.cz' }}
    steps:
      - name: Klon (deploy = blobless s historii, ostatni = melky s obsahem)
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$MODE" = deploy ]; then
            git clone --filter=blob:none --no-checkout --single-branch --branch main "$URL" cdn
          else
            git clone --depth 1 --no-checkout --single-branch --branch main "$URL" cdn
          fi
          cd cdn
          git -c core.autocrlf=false checkout HEAD -- tools/azure-blob-lib.mjs tools/deploy-blob.mjs tools/verify-live.mjs
          node --version
      - name: Nasazeni / overeni
        working-directory: cdn
        run: |
          if [ "$MODE" = live ]; then
            SHA=$(node tools/deploy-blob.mjs --mode state)
            git cat-file -e "${SHA}^{commit}" 2>/dev/null || git fetch -q --depth 1 origin "$SHA"
            node tools/verify-live.mjs --base "$LIVE_BASE" --sha "$SHA" --concurrency 32
          else
            node tools/deploy-blob.mjs --mode "$MODE"
          fi
