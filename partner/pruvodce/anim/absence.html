    await sleep(3000); if (tk !== token) return;
    await moveTo($('bNew'), 0.5, 0.5, 1000); await click(); openBlade();
    await sleep(1500); if (tk !== token) return;
    await moveTo($('fFrom'), 0.3, 0.5, 900); await click(); $('fFrom').classList.add('hot'); await sleep(450); $('tFrom').textContent = '12.10.2026'; $('fFrom').classList.remove('hot');
    await moveTo($('fTo'), 0.3, 0.5, 600); await click(); $('fTo').classList.add('hot'); await sleep(450); setRange(); $('fTo').classList.remove('hot');
    await sleep(500); await moveTo($('fNote'), 0.3, 0.5, 700); await click();
    if (!(await typeInto($('fNote'), NOTE, 70, tk))) return;
    $('fNote').classList.remove('hot'); await sleep(700); if (tk !== token) return;
    await moveTo($('bSend'), 0.5, 0.5, 800); $('bSend').classList.add('press'); await click(); $('bSend').classList.remove('press');
    closeBlade(); submitted(); toast(t('Žádost odeslána ke schválení', 'Request submitted for approval'));
    await sleep(2200); $('toast').classList.remove('on'); if (tk !== token) return;
    await moveTo($('n-cal'), 0.4, 0.5, 900); await click(); setView('cal');
    await sleep(3400); if (tk !== token) return;
    await moveTo($('n-ap'), 0.4, 0.5, 900); await click(); setView('ap');
    await sleep(1800); if (tk !== token) return;
    await moveTo($('r1A'), 0.5, 0.5, 1000); $('r1A').classList.add('press'); await click(); $('r1A').classList.remove('press'); approved(); toast(t('Žádost schválena', 'Request approved'));
    await sleep(3000); $('toast').classList.remove('on'); if (tk !== token) return;
    cur.classList.remove('on'); stage.classList.add('fade'); await sleep(650); if (tk !== token) return;
    resetAll(); await sleep(150); stage.classList.remove('fade'); await sleep(300);
  }
  async function loop() { var tk = ++token; while (tk === token) await play(tk); }
  function start() { if (!running) { running = true; loop(); } }
  function stop() { if (running) { running = false; token++; stage.classList.remove('fade'); resetAll(); } }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setView('dash');
  var hash = location.hash;
  function noTr(el) { el.style.transition = 'none'; void el.offsetWidth; }
  if (hash === '#dash') return;
  if (hash === '#blade' || hash === '#blade2') { noTr($('blade')); noTr($('dim')); openBlade(); if (hash === '#blade2') { setRange(); $('fNote').textContent = NOTE; } return; }
  if (hash === '#cal') { setView('cal'); return; }
  if (hash === '#ap') { setView('ap'); return; }
  if (hash === '#apdone') { setView('ap'); approved(); return; }
  if (reduce) return;
  if (EMBED) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.ep365anim === undefined) return;
      if (e.data.ep365anim === 'play') start(); else stop();
    });
    window.parent.postMessage({ ep365animReady: true }, '*');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) start(); else stop(); }); }, { threshold: 0.35 }).observe(box);
  } else { start(); }
})();
