    if (h === 'approvals') setView('approvals');
    if (h === 'blade') { setView('approvals'); openBlade(APPROVE_BLADE); }
    if (h === 'reserve') { setView('reserve'); $('sbi').style.transition = 'none'; $('sbi').style.transform = 'translateY(-150px)'; }
    if (h === 'form') { setView('reserve'); openBlade(RESERVE_BLADE, true); }
    return;
  }
  if (reduce) return;
  if (EMBED) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.ep365anim === undefined) return;
      if (e.data.ep365anim === 'play') start(); else stop();
    });
    window.parent.postMessage({ ep365animReady: true }, '*');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) start(); else stop(); }); }, { threshold: 0.35 }).observe(box);
  } else { start(); }
})();
</script>
