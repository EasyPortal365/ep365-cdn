    '<div class="bb"><div class="c1"><div class="ftw" style="grid-template-columns:1fr"><div class="bbtn tl" id="bSolve">' + ic(P.chk, 12, '#002163', 2) + '<span id="bSolveT">' + t('Vyřešit', 'Resolve') + '</span></div></div><div class="lb2">' + t('SLA · PLÁN STANDARD', 'SLA · STANDARD PLAN') + '</div><div class="kvs"><small>' + t('PRVNÍ REAKCE · DO 29. 9. 2026 17:11', 'FIRST REPLY · BY 29 SEP 2026 17:11') + '</small><em id="bSla">' + t('reakce po termínu 35 min', 'reply overdue 35 min') + '</em><small>' + t('VYŘEŠENÍ · DO 30. 9. 2026 15:12', 'RESOLUTION · BY 30 SEP 2026 15:12') + '</small><b>30. 9. 2026 15:12</b></div>' +
    '<div class="lb2">' + t('ZAŘAZENÍ', 'CLASSIFICATION') + '</div><div class="ftw"><div><div class="kvs"><small>' + t('PRIORITA', 'PRIORITY') + '</small></div><div class="fsel">' + t('Kritická', 'Critical') + ic(P.chev, 10) + '</div></div><div><div class="kvs"><small>' + t('KATEGORIE', 'CATEGORY') + '</small></div><div class="fsel">Incident' + ic(P.chev, 10) + '</div></div></div><div class="kvs"><small>' + t('TYP PRÁCE', 'WORK TYPE') + '</small></div><div class="fsel">' + t('Servisní podpora – v paušálu', 'Service support – in retainer') + ic(P.chev, 10) + '</div></div>' +
    '<div class="c2"><div class="lb2">' + t('LIDÉ', 'PEOPLE') + '</div><div class="kvs"><small>' + t('ŽADATEL', 'REQUESTER') + '</small><b>Karel Šimek</b><small>' + t('ŘEŠITEL', 'ASSIGNEE') + '</small></div><div class="fsel" id="bAss" style="color:#4A5874">' + t('– nepřiřazen –', '– unassigned –') + ic(P.chev, 10) + '</div><div class="bbtn" id="bTake" style="margin-top:8px;height:28px">' + t('Převzít tiket', 'Take ticket') + '</div>' +
    '<div class="lb2">' + t('FIRMA A SMLOUVA', 'COMPANY AND CONTRACT') + '</div><div class="kvs"><small>' + t('FIRMA', 'COMPANY') + '</small><b>MediPlus a.s.</b><small>' + t('SMLOUVA', 'CONTRACT') + '</small><b>Standard · 8 h/' + t('měs', 'mo') + '</b></div><div class="lb2">' + t('PŮVOD', 'ORIGIN') + '</div><div class="kvs"><small>' + t('KANÁL', 'CHANNEL') + '</small><b>E-mail</b><small>' + t('VYTVOŘENO', 'CREATED') + '</small><b>29. 9. 2026 15:11</b></div></div>' +
    '<div class="c3"><div class="tabs"><span class="on">' + t('Konverzace', 'Conversation') + '<small id="nMsg">2</small></span><span>' + t('Aktivita', 'Activity') + '<small>3</small></span></div><div class="thread" id="thread"><div class="msg"><div class="w">Karel Šimek · 29. 9. 15:11</div><div class="bub">' + t('Od rána se část kolegů nemůže přihlásit do intranetu – hlásí to smyčku přihlašování. Týká se to hlavně výroby.', 'Since the morning some colleagues cannot sign in to the intranet – they report a sign-in loop. It mainly affects production.') + '</div></div><div class="msg note"><div class="w">' + t('Interní poznámka · zákazník nevidí', 'Internal note · not visible to the customer') + ' · ' + t('Tým podpory', 'Support team') + '</div><div class="bub">' + t('Vypadá to na expirované heslo servisního účtu proxy. Eskalováno na infrastrukturu.', 'It looks like an expired password of the proxy service account. Escalated to infrastructure.') + '</div></div></div>' +
    '<div class="comp"><span class="ct"><span class="on">' + t('Odpověď zákazníkovi', 'Reply to customer') + '</span><span>' + t('Interní poznámka', 'Internal note') + '</span></span><div class="ed"><div class="tb"><span>B</span><span><i style="font-style:italic">I</i></span><span>•</span><span>1.</span></div><div class="bx ph" id="bBox">' + t('Napište odpověď – odešle se zákazníkovi e-mailem a uloží do vlákna…', 'Write a reply – it is e-mailed to the customer and saved to the thread…') + '</div></div>' +
    '<div class="cf"><span class="mini">' + ic(P.clip, 11, '#002163', 1.4) + '</span><span class="mini">' + ic(P.bolt, 11, '#002163', 1.4) + t('Makro', 'Macro') + '</span><span class="mini">' + ic(P.art, 11, '#002163', 1.4) + t('Článek', 'Article') + '</span><span class="from">' + t('Odejde z support@firma.cz', 'Sent from support@company.com') + '</span><span class="snd" id="bSend">' + ic(P.send, 12, '#fff', 1.6) + t('Odeslat odpověď', 'Send reply') + '</span></div></div></div></div>' +
    '<div style="display:flex;align-items:center;gap:10px;padding:10px 22px;border-top:1px solid #E7ECF3"><span style="flex:1"></span><span class="abtn">' + ic(P.clip, 12, '#002163', 1.4) + t('Duplikovat', 'Duplicate') + '</span></div></div>';

  $('app').innerHTML = sidebar + '<section class="main">' + dash + tick + '</section>' + blade;

  var box = $('box'), stage = $('stage'), cur = $('cur'), W = 1160, HH = 660, cx = 0, cy = 0;
  function k() { return (box.clientWidth || W) / W; }
  function fit() { var w = box.clientWidth || W, s = w / W; stage.style.transform = 'scale(' + s + ')'; box.style.height = Math.round(HH * s) + 'px'; }
  fit(); window.addEventListener('resize', fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(box);
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rectOf(el) { var r = el.getBoundingClientRect(), b = stage.getBoundingClientRect(), s = k(); return { x: (r.left - b.left) / s, y: (r.top - b.top) / s, w: r.width / s, h: r.height / s }; }
  function curTo(x, y, ms) { cx = x; cy = y; cur.style.transitionDuration = ms + 'ms'; cur.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }
  async function moveTo(el, fx, fy, ms) { var r = rectOf(el), d = ms || 900; cur.classList.add('on'); curTo(r.x + r.w * (fx == null ? 0.5 : fx), r.y + r.h * (fy == null ? 0.5 : fy), d); await sleep(d + 60); }
  async function click() {
    var r = document.createElement('i'); r.className = 'rip'; r.style.left = cx + 'px'; r.style.top = cy + 'px'; stage.appendChild(r); setTimeout(function () { r.remove(); }, 650);
    cur.classList.add('down'); await sleep(140); cur.classList.remove('down'); await sleep(180);
  }
  var SNAP = $('app').innerHTML;
  var VIEWS = { dash: 'n-dash', tick: 'n-tick' };
  function setView(name) { Object.keys(VIEWS).forEach(function (v) { $('v-' + v).classList.toggle('on', v === name); $(VIEWS[v]).classList.toggle('on', v === name); }); }
  function resetAll() { $('app').innerHTML = SNAP; cur.classList.remove('on', 'down'); curTo(1090, 610, 0); setView('dash'); }
  function openBlade() { $('dim').classList.add('on'); $('blade').classList.add('on'); }
  function closeBlade() { $('dim').classList.remove('on'); $('blade').classList.remove('on'); }
  var ME = 'Jana Nováková', REPLY = t('Dobrý den, příčinou byl expirovaný účet proxy. Heslo jsme obnovili, přihlášení už funguje. Děkujeme za trpělivost.', 'Hello, the cause was an expired proxy account. We renewed the password and sign-in works again. Thank you for your patience.');
  function take() { $('bAss').innerHTML = '<span style="color:#002163;font-weight:600">' + ME + '</span>' + ic(P.chev, 10); $('bTake').style.display = 'none'; }
  function sent() { var b = $('bBox'); b.classList.add('ph'); b.textContent = t('Napište odpověď – odešle se zákazníkovi e-mailem a uloží do vlákna…', 'Write a reply – it is e-mailed to the customer and saved to the thread…'); $('bSend').classList.remove('rdy'); var m = document.createElement('div'); m.className = 'msg me new'; m.innerHTML = '<div class="w">' + ME + ' · 30. 9. 15:47</div><div class="bub">' + REPLY + '</div>'; $('thread').appendChild(m); $('nMsg').textContent = '3'; $('bSla').textContent = t('první reakce odeslána', 'first reply sent'); $('bSla').style.color = '#1a8a5a'; }
  function solved() { $('bSt').className = 'st ok'; $('bSt').lastChild.textContent = t('VYŘEŠENO', 'RESOLVED'); $('bSolve').className = 'bbtn ok'; $('bSolveT').textContent = t('Vyřešeno', 'Resolved'); var s = $('t4S'); s.className = 'st ok'; s.lastChild.textContent = t('VYŘEŠENO', 'RESOLVED'); var l = $('t4L'); l.className = 'sla gr'; l.textContent = t('splněno', 'met'); $('t4R').textContent = ME; $('t4R').style.color = '#002163'; $('pRes').textContent = '1'; }
  async function typeInto(el, txt, per, tk) { el.classList.remove('ph'); for (var i = 1; i <= txt.length; i++) { el.innerHTML = '<span class="caret">' + txt.slice(0, i) + '</span>'; if (i > 12) $('bSend').classList.add('rdy'); await sleep(per); if (tk !== token) return false; } el.textContent = txt; return true; }

  var token = 0, running = false;
  async function play(tk) {
    resetAll(); stage.classList.remove('fade');
    await sleep(3200); if (tk !== token) return;
    await moveTo($('n-tick'), 0.4, 0.5, 1000); await click(); setView('tick');
    await sleep(2200); if (tk !== token) return;
    await moveTo($('t4'), 0.3, 0.5, 1000); await click(); openBlade();
    await sleep(2200); if (tk !== token) return;
    await moveTo($('bTake'), 0.5, 0.5, 900); $('bTake').classList.add('press'); await click(); $('bTake').classList.remove('press'); take();
    await sleep(700); await moveTo($('bBox'), 0.3, 0.5, 800); await click();
    if (!(await typeInto($('bBox'), REPLY, 20, tk))) return;
    await sleep(500); await moveTo($('bSend'), 0.5, 0.5, 800); $('bSend').classList.add('press'); await click(); $('bSend').classList.remove('press'); sent();
    await sleep(1600); if (tk !== token) return;
    await moveTo($('bSolve'), 0.5, 0.5, 900); $('bSolve').classList.add('press'); await click(); $('bSolve').classList.remove('press'); solved();
    await sleep(1700); if (tk !== token) return;
    await moveTo($('bX').firstChild, 0.5, 0.5, 800); await click(); closeBlade();
    await sleep(3400); if (tk !== token) return;
    cur.classList.remove('on'); stage.classList.add('fade'); await sleep(650); if (tk !== token) return;
    resetAll(); await sleep(150); stage.classList.remove('fade'); await sleep(300);
  }
  async function loop() { var tk = ++token; while (tk === token) await play(tk); }
  function start() { if (!running) { running = true; loop(); } }
  function stop() { if (running) { running = false; token++; stage.classList.remove('fade'); resetAll(); } }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setView('dash');
  var hash = location.hash;
  function noTr(el) { el.style.transition = 'none'; void el.offsetWidth; }
  if (hash === '#dash') return;
  if (hash === '#tick') { setView('tick'); return; }
  if (hash === '#blade' || hash === '#reply' || hash === '#solved') {
    setView('tick'); noTr($('blade')); noTr($('dim')); openBlade();
    if (hash !== '#blade') { take(); sent(); }
    if (hash === '#solved') { solved(); }
    return;
  }
  if (reduce) return;
  if (EMBED) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.ep365anim === undefined) return;
      if (e.data.ep365anim === 'play') start(); else stop();
    });
    window.parent.postMessage({ ep365animReady: true }, '*');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) start(); else stop(); }); }, { threshold: 0.35 }).observe(box);
  } else { start(); }
})();
