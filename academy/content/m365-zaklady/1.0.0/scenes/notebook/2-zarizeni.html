<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akademie – Najděte ztracený notebook</title>
<link rel="stylesheet" href="../m365.css">
</head>
<body>
<div id="box" class="stage-box"><div id="stage" class="stage"><div id="app"></div></div></div>
<script src="../scene.js"></script>
<script src="ucet.js"></script>
<script>
/* Scéna 2 – Zařízení › karta notebooku: název, BitLocker, Stav organizace, ID, odkaz Zakázání zařízení. Podle reference _ref/notebook/d02. */
(function () {
  var A = AK, U = AKU;
  A.Scene({
    build: function () { return U.page({ view: 'dev' }); },
    lead: 1000,
    tail: 2600,
    play: async function (api) {
      await api.moveTo('devHead', 0.12, 0.5, 1000);
      await api.sleep(700);
      await api.moveTo('devName', 0.5, 0.5, 800);
      await api.sleep(900);
      await api.moveTo('rBit', 0.5, 0.5, 700);
      U.show({ view: 'dev', hv: 'rBit' });
      await api.sleep(1000);
      await api.moveTo('rState', 0.4, 0.5, 600);
      U.show({ view: 'dev', hv: 'rState' });
      await api.sleep(1000);
      U.show({ view: 'dev' });
      await api.moveTo('lnkDisable', 0.5, 0.6, 800);
      await api.sleep(800);
    },
    states: {
      end: function () { U.show({ view: 'dev' }); }
    }
  });
})();
</script>
</body>
</html>
