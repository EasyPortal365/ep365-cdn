<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akademie – Nahlaste ji jedním klikem</title>
<link rel="stylesheet" href="../m365.css">
</head>
<body>
<div id="box" class="stage-box"><div id="stage" class="stage"><div id="app"></div></div></div>
<script src="../scene.js"></script>
<script src="email.js"></script>
<script>
/* Scéna 2 – pás karet › Nahlásit ▾ › Nahlásit útok phishing.
   Podle referencí _ref/email/e05 (pás karet se zprávou) a e06 (nabídka Nahlásit v Doručené poště: Nahlásit útok phishing / Nahlásit spam).
   Stav po nahlášení předloha nemá – scéna končí kliknutím. */
(function () {
  var A = AK, E = AKE;
  A.Scene({
    build: function () { return E.page({ folder: 'inbox', sel: true }); },
    lead: 1000,
    tail: 2000,
    play: async function (api) {
      await api.moveTo('repCv', 0.5, 0.5, 1100);
      await api.click();
      E.show({ folder: 'inbox', sel: true, menu: true });
      await api.sleep(1000);
      await api.moveTo('rm1', 0.4, 0.5, 600);
      E.show({ folder: 'inbox', sel: true, menu: true, hot: 1 });
      await api.sleep(800);
      await api.moveTo('rm0', 0.4, 0.5, 500);
      E.show({ folder: 'inbox', sel: true, menu: true, hot: 0 });
      await api.sleep(900);
      await api.click();
    },
    states: {
      end: function () { E.show({ folder: 'inbox', sel: true, menu: true, hot: 0 }); }
    }
  });
})();
</script>
</body>
</html>
