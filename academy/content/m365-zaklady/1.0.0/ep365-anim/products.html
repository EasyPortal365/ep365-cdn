  :root { --navy:#002163; --teal:#15C6D4; --teal7:#00A8B0; --tealb:#00CED7; --muted:#4A5874; --soft:#7A8499; --line:#E0E6EF; --mint:#E4F7F6; --red:#D14343; --green:#34B36A; --amber:#E6A23C; }

  .app { display:flex; height:626px; position:relative; overflow:hidden; }
  .sb { width:208px; flex:none; background:#FBFCFE; border-right:1px solid var(--line); padding:14px 10px 0; }
  .brand { display:flex; gap:10px; align-items:center; margin:0 4px 12px; }

  .brand b { display:block; font-family:Manrope,sans-serif; font-weight:800; font-size:13px; } .brand span { display:block; font-family:"JetBrains Mono",monospace; font-size:7px; letter-spacing:.1em; color:var(--soft); margin-top:2px; }
  .newb { height:32px; border-radius:9px; background:linear-gradient(90deg,#0ACFD8,#7EE5EA); color:#002163; font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px; }
  .ssearch { height:28px; border:1px solid var(--line); border-radius:9px; background:#fff; display:flex; align-items:center; gap:7px; padding:0 9px; font-size:10.5px; color:var(--soft); margin-bottom:10px; }

  .crumb { font-size:10px; color:var(--soft); } .crumb b { color:var(--navy); font-weight:600; }

  .tools { position:absolute; right:26px; top:30px; display:flex; gap:8px; align-items:center; } .tools i { width:28px; height:28px; border-radius:50%; border:1px solid #D5DCE8; display:grid; place-items:center; background:#fff; }

  .chips { display:flex; gap:8px; align-items:center; margin-top:10px; } .chips em { font-family:"JetBrains Mono",monospace; font-style:normal; font-size:8px; letter-spacing:.16em; color:var(--soft); }
  .chip { height:24px; padding:0 12px; border:1px solid #D5DCE8; border-radius:999px; background:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; white-space:nowrap; }
  .fl { position:absolute; width:210px; height:46px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 20px -12px rgba(0,33,99,.25); display:flex; align-items:center; gap:10px; padding:0 11px; }
  .fl i { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none; }
  .fl b { display:block; font-family:Manrope,sans-serif; font-weight:800; font-size:11.5px; } .fl span { display:block; font-family:"JetBrains Mono",monospace; font-size:7.5px; color:var(--soft); }
  .ban { margin:16px 22px 0; background:#DDF7F8; border:1px solid #BFEAEE; border-radius:12px; padding:10px 16px; display:flex; gap:12px; align-items:center; font-size:10.5px; color:var(--muted); } .ban b { color:var(--navy); } .ban .bt { margin-left:auto; height:28px; padding:0 14px; border-radius:999px; background:#00C7D0; color:#002163; font-weight:700; font-size:10px; display:flex; align-items:center; }

  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:0 22px; }

  .pc.hid { display:none; }
  /* katalog */
  .pills { display:flex; gap:8px; align-items:center; margin:16px 22px 0; } .pill { height:28px; padding:0 15px; border:1px solid #D5DCE8; border-radius:999px; font-size:11px; font-weight:600; display:flex; align-items:center; gap:6px; background:#fff; color:var(--navy); transition:background .2s, color .2s; } .pill small { font-family:"JetBrains Mono",monospace; font-size:9px; color:var(--soft); } .pill.on { background:#002163; border-color:#002163; color:#fff; } .pill.on small { color:#9FB3DE; }

  .vis { font-family:"JetBrains Mono",monospace; font-size:7px; letter-spacing:.08em; background:#FFF1D6; color:#9A6A08; border-radius:4px; padding:1px 6px; margin-left:6px; }
  .toast { position:absolute; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:#002163; color:#fff; font-size:11px; font-weight:600; border-radius:999px; padding:9px 18px; display:flex; gap:8px; align-items:center; opacity:0; transition:opacity .3s, transform .3s; z-index:16; } .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .cur { position:absolute; left:0; top:0; z-index:30; pointer-events:none; opacity:0; transform:translate(1090px,610px); transition:transform .9s cubic-bezier(.45,.05,.25,1), opacity .3s; }
  .cur.on { opacity:1; } .cur svg { display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); transition:transform .12s; } .cur.down svg { transform:scale(.85); }
  .rip { position:absolute; z-index:25; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; border:2px solid #00CED7; pointer-events:none; animation:rp .6s ease-out forwards; }
  @keyframes rp { from { transform:scale(1); opacity:.9; } to { transform:scale(4); opacity:0; } }
