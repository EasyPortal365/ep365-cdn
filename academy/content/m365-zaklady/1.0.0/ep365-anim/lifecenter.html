  var STEPS = [[t('Den 1 – Welcome', 'Day 1 – Welcome'), t('Uvítání, průkaz, pracovní místo', 'Welcome, ID card, workstation'), t('Den 1', 'Day 1')], [t('Týden 1 – IT a vybavení', 'Week 1 – IT and equipment'), t('Notebook, účty, přístupy', 'Laptop, accounts, access'), t('Týden 1', 'Week 1')], [t('Týden 1 – Lidé a procesy', 'Week 1 – People and processes'), t('Seznámení s týmem a vedoucím', 'Meet the team and your manager'), t('Týden 1', 'Week 1')], [t('Měsíc 1 – Mzdové dokumenty', 'Month 1 – Payroll documents'), t('Potvrzení, daňové prohlášení', 'Confirmations, tax declaration'), t('Měsíc 1', 'Month 1')], [t('Měsíc 1 – Onboarding training', 'Month 1 – Onboarding training'), t('Povinná školení', 'Mandatory training'), t('Měsíc 1', 'Month 1')], [t('Měsíc 2 – První 1:1 s vedoucím', 'Month 2 – First 1:1 with your manager'), t('Cíle a očekávání', 'Goals and expectations'), t('Měsíc 2', 'Month 2')], [t('Měsíc 3 – Mid-probation check', 'Month 3 – Mid-probation check'), t('Zpětná vazba ke zkušební době', 'Probation feedback'), t('Měsíc 3', 'Month 3')], [t('Den 90 – Hodnocení', 'Day 90 – Review'), t('Závěrečné hodnocení zkušební doby', 'Final probation review'), t('Den 90', 'Day 90')]];
  var tocRows = STEPS.map(function (s, i) { return '<div class="r" id="toc' + i + '">' + s[0] + '</div>'; }).join('');
  var clRows = STEPS.map(function (s, i) { return '<div class="cr" id="cr' + i + '"><span class="cbx2" id="cb' + i + '">' + CK + '</span><div><b>' + s[0] + '</b><small>' + s[1] + '</small></div><span class="dd">' + s[2] + '</span></div>'; }).join('');
  var artv = '<div class="pg" id="v-art"><div class="head" style="height:190px"><div class="crumb">' + t('ROZCESTNÍK / JSEM NOVÁČEK / <b>PRVNÍCH 90 DNÍ – CHECKLIST PRO NOVÉ KOLEGY</b>', 'HOME / I AM NEW / <b>FIRST 90 DAYS – CHECKLIST</b>') + '</div><div class="kick">' + t('JSEM NOVÁČEK · CHECKLIST', 'I AM NEW · CHECKLIST') + '</div><h1 style="font-size:24px">' + t('Prvních 90 dní – checklist pro nové kolegy', 'First 90 days – checklist for new colleagues') + '</h1><p style="margin-top:6px">' + t('Co vás čeká od podpisu smlouvy po hodnocení po zkušební době. Pro nováčky i jejich vedoucí.', 'What awaits you from signing the contract to the probation review. For newcomers and their managers.') + '</p>' +
    '<div class="brow" style="margin-top:12px"><span class="abtn" style="border-color:#9FE3E8;color:#0e8f98">' + ic(P.pencil, 12, '#0e8f98') + t('Upravit', 'Edit') + '</span><span class="abtn">' + ic(P.mark, 12, '#002163') + t('Uložit', 'Save') + '</span><span class="abtn ic2">' + ic(P.print, 12, '#002163') + '</span></div>' + qa + '</div>' +
    '<div class="agrid"><div class="toc"><div class="hd">' + t('OBSAH ČLÁNKU', 'IN THIS ARTICLE') + '</div>' + tocRows + '<div class="pp"><div class="hd">' + t('POSTUP', 'PROGRESS') + '<b id="ppN">0 / 8</b></div><div class="bar"><i id="ppB"></i></div></div></div>' +
    '<div class="abody"><div class="auth"><i>LH</i><div><b>Lenka Horáková</b><span>' + t('Nováček', 'Newcomer') + '</span></div><em>' + t('Před měsícem', 'A month ago') + '<br>6 min · 1252 ' + t('čtenářů', 'readers') + '</em></div>' +
    '<div class="hero-img"><s style="width:120px;height:120px;right:40px;top:-20px"></s><s style="width:70px;height:70px;left:60px;bottom:-20px"></s><s style="width:26px;height:26px;left:40px;top:40px;border-radius:6px;background:rgba(255,255,255,.2)"></s><s style="width:34px;height:34px;left:130px;top:70px;border-radius:6px;background:rgba(255,255,255,.3)"></s></div><div class="cap">' + t('Prvních 90 dní má jasnou strukturu – projdeme je s vámi krok za krokem.', 'The first 90 days have a clear structure – we will go through them with you step by step.') + '</div>' +
    '<p>' + t('Prvních devadesát dní má jasnou strukturu, ať nemusíte hádat, co se od vás čeká. Checklist níže si můžete odškrtávat – postup se ukládá jen vám.', 'The first ninety days have a clear structure so you do not have to guess what is expected. You can tick off the checklist below – your progress is saved for you only.') + '</p>' +
    '<h3>' + t('Váš checklist', 'Your checklist') + '</h3><div class="cl" id="cl">' + clRows + '</div></div></div></div>';

  /* ── Přehled plnění ── */
  function tr(id, who, sit, done, step, due, st, cls) { return '<div class="tr" id="' + id + '"><b>' + who + '</b><span>' + sit + '</span><div><span style="font-family:JetBrains Mono,monospace;font-size:9px;color:#4A5874">' + done + ' / 8</span><div class="pb"><i style="width:' + (done * 12.5) + '%"></i></div></div><span>' + step + '</span><span style="font-family:JetBrains Mono,monospace;font-size:9px">' + due + '</span><span class="st ' + cls + '">' + st + '</span></div>'; }
  var prog = '<div class="pg" id="v-prog"><div class="head" style="height:176px"><div class="crumb">' + t('ROZCESTNÍK / <b>PŘEHLED PLNĚNÍ</b>', 'HOME / <b>PROGRESS OVERVIEW</b>') + '</div><div class="kick">' + t('PŘIDĚLOVÁNÍ · 5 PŘIDĚLENÍ', 'ASSIGNING · 5 ASSIGNMENTS') + '</div><h1>' + t('Přehled plnění.', 'Progress overview.') + '</h1><h2>' + t('Kdo je kde a co visí.', 'Who is where and what is stuck.') + '</h2><p style="margin-top:6px">' + t('Přidělení vašich lidí a ta, která jste přidělili vy. Ostatní nevidíte – hranici drží oprávnění na položce.', 'Assignments of your people and those you assigned. You cannot see others – the boundary is held by item permissions.') + '</p>' + qa + '</div>' +
    '<div class="kp" style="margin-top:16px"><div class="kc"><div class="lbl">' + t('AKTIVNÍ PŘIDĚLENÍ', 'ACTIVE ASSIGNMENTS') + '</div><b>4</b><div class="sub">' + t('nezahájená a probíhající', 'not started and in progress') + '</div></div><div class="kc"><div class="lbl">' + t('PO TERMÍNU', 'OVERDUE') + '</div><b>1</b><div class="sub">' + t('přidělení nesplněná včas', 'assignments not completed in time') + '</div></div><div class="kc"><div class="lbl">' + t('S KROKEM PO TERMÍNU', 'WITH A STEP OVERDUE') + '</div><b>1</b><div class="sub">' + t('přidělení, kde něco visí', 'assignments with something pending') + '</div></div><div class="kc"><div class="lbl">' + t('SPLNĚNO', 'COMPLETED') + '</div><b class="g">1</b><div class="sub">' + t('všechny povinné kroky', 'all mandatory steps') + '</div></div></div>' +
    '<div class="tcard"><div class="pills"><span class="pill on" id="plAct">' + t('Aktivní', 'Active') + ' <small>4</small></span><span class="pill" id="plLate">' + t('Po termínu', 'Overdue') + ' <small>1</small></span><span class="pill">' + t('S krokem po termínu', 'Step overdue') + ' <small>1</small></span><span class="pill">' + t('Probíhá', 'In progress') + ' <small>2</small></span><span class="pill">' + t('Nezahájeno', 'Not started') + ' <small>1</small></span><span class="pill">' + t('Splněno', 'Completed') + ' <small>1</small></span></div>' +
    '<div class="tr h"><span>' + t('OSOBA', 'PERSON') + '</span><span>' + t('SITUACE', 'SITUATION') + '</span><span>' + t('PRŮBĚH', 'PROGRESS') + '</span><span>' + t('DALŠÍ KROK', 'NEXT STEP') + '</span><span>' + t('TERMÍN', 'DUE') + '</span><span>' + t('STAV', 'STATUS') + '</span></div>' +
    tr('pr1', 'Petr Svoboda', t('Jsem nováček', 'I am new'), 3, t('Týden 1 – Lidé a procesy', 'Week 1 – People and processes'), '3. 10.', t('PROBÍHÁ', 'IN PROGRESS'), 'p') +
    tr('pr2', 'Tomáš Král', t('Jsem nováček', 'I am new'), 1, t('Týden 1 – IT a vybavení', 'Week 1 – IT and equipment'), '22. 9.', t('PO TERMÍNU', 'OVERDUE'), 'l') +
    tr('pr3', 'Eva Malá', t('Odcházím na mateřskou', 'Going on parental leave'), 4, t('Předání agendy', 'Handing over duties'), '7. 10.', t('PROBÍHÁ', 'IN PROGRESS'), 'p') +
    tr('pr4', 'Martin Dlouhý', t('Měním pozici', 'Changing role'), 0, t('Schválení přesunu', 'Transfer approval'), '14. 10.', t('NEZAHÁJENO', 'NOT STARTED'), 'n') +
    tr('pr5', 'Lenka Dvořáková', t('Jsem nováček', 'I am new'), 8, '–', '15. 9.', t('SPLNĚNO', 'COMPLETED'), 'o') + '</div></div>';

  var main = '<section class="main">' + home + sit + artv + prog + '</section>';
  $('app').innerHTML = sidebar + main;

  var box = $('box'), stage = $('stage'), cur = $('cur'), W = 1160, HH = 660, cx = 0, cy = 0;
  function k() { return (box.clientWidth || W) / W; }
  function fit() { var w = box.clientWidth || W, s = w / W; stage.style.transform = 'scale(' + s + ')'; box.style.height = Math.floor(HH * s) + 'px'; }
  fit(); window.addEventListener('resize', fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(box);
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rectOf(el) { var r = el.getBoundingClientRect(), b = stage.getBoundingClientRect(), s = k(); return { x: (r.left - b.left) / s, y: (r.top - b.top) / s, w: r.width / s, h: r.height / s }; }
  function curTo(x, y, ms) { cx = x; cy = y; cur.style.transitionDuration = ms + 'ms'; cur.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }
  async function moveTo(el, fx, fy, ms) { var r = rectOf(el), d = ms || 900; cur.classList.add('on'); curTo(r.x + r.w * (fx == null ? 0.5 : fx), r.y + r.h * (fy == null ? 0.5 : fy), d); await sleep(d + 60); }
  async function click() {
    var r = document.createElement('i'); r.className = 'rip'; r.style.left = cx + 'px'; r.style.top = cy + 'px'; stage.appendChild(r); setTimeout(function () { r.remove(); }, 650);
    cur.classList.add('down'); await sleep(140); cur.classList.remove('down'); await sleep(180);
  }
  var SNAP = $('app').innerHTML;
  var VIEWS = { home: 'n-home', sit: 'n-home', art: 'n-home', prog: 'n-prog' };
  function setView(name) {
    Object.keys(VIEWS).forEach(function (v) {
      var pg = $('v-' + v); pg.classList.toggle('on', v === name);
      pg.style.transition = 'none'; pg.style.transform = 'translateY(0)'; void pg.offsetWidth; pg.style.transition = '';
    });
    ['n-home', 'n-prog'].forEach(function (n) { $(n).classList.remove('on'); }); $(VIEWS[name]).classList.add('on');
  }
  function resetAll() { $('app').innerHTML = SNAP; cur.classList.remove('on', 'down'); curTo(1090, 610, 0); setView('home'); }
  function scrollTo(v, y) { $('v-' + v).style.transform = 'translateY(' + y + 'px)'; }
  function tick(i) {
    $('cb' + i).classList.add('on'); $('cr' + i).classList.add('done'); $('toc' + i).classList.add('ok');
    var n = document.querySelectorAll('#v-art .cbx2.on').length; $('ppN').textContent = n + ' / 8'; $('ppB').style.width = (n * 12.5) + '%';
  }
  function lateOnly() { ['pr1', 'pr3', 'pr4', 'pr5'].forEach(function (id) { $(id).classList.add('gone'); }); $('plAct').classList.remove('on'); $('plLate').classList.add('on'); }

  var token = 0, running = false;
  async function play(tk) {
    resetAll(); stage.classList.remove('fade');
    await sleep(1800); if (tk !== token) return;
    scrollTo('home', -300); await sleep(3800); if (tk !== token) return;
    scrollTo('home', 0); await sleep(1500); if (tk !== token) return;
    await moveTo($('fcNew'), 0.4, 0.5, 1000); await click(); setView('sit');
    await sleep(2600); if (tk !== token) return;
    await moveTo($('artChk'), 0.3, 0.5, 900); await click(); setView('art');
    await sleep(1700); if (tk !== token) return;
    scrollTo('art', -270); await sleep(1600); if (tk !== token) return;
    for (var i = 0; i < 3; i++) { await moveTo($('cb' + i), 0.5, 0.5, 650); await click(); tick(i); await sleep(250); if (tk !== token) return; }
    await sleep(2200); if (tk !== token) return;
    await moveTo($('n-prog'), 0.4, 0.5, 900); await click(); setView('prog');
    await sleep(2400); if (tk !== token) return;
    await moveTo($('plLate'), 0.5, 0.5, 900); await click(); lateOnly();
    await sleep(3000); if (tk !== token) return;
    cur.classList.remove('on'); stage.classList.add('fade'); await sleep(650); if (tk !== token) return;
    resetAll(); await sleep(150); stage.classList.remove('fade'); await sleep(300);
  }
  async function loop() { var tk = ++token; while (tk === token) await play(tk); }
  function start() { if (!running) { running = true; loop(); } }
  function stop() { if (running) { running = false; token++; stage.classList.remove('fade'); resetAll(); } }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setView('home');
  var hash = location.hash;
  function still(v) { var p = $('v-' + v); p.style.transition = 'none'; return p; }
  if (hash === '#home') return;
  if (hash === '#tl') { setView('home'); still('home'); scrollTo('home', -300); return; }
  if (hash === '#sit') { setView('sit'); return; }
  if (hash === '#art' || hash === '#art3') { setView('art'); still('art'); scrollTo('art', -270); if (hash === '#art3') { tick(0); tick(1); tick(2); } return; }
  if (hash === '#prog' || hash === '#late') { setView('prog'); if (hash === '#late') lateOnly(); return; }
  if (reduce) return;
  if (EMBED) {
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.ep365anim === undefined) return;
      if (e.data.ep365anim === 'play') start(); else stop();
    });
    window.parent.postMessage({ ep365animReady: true }, '*');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) start(); else stop(); }); }, { threshold: 0.35 }).observe(box);
  } else { start(); }
})();
</script>
