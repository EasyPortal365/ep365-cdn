  var ful = '<div class="pg" id="v-ful"><div class="head"><div class="crumb">EP365 E-shop / <b>' + t('Vyřízení objednávek', 'Order fulfilment') + '</b></div><div class="kick" id="fK">2 ' + t('ČEKAJÍ NA VYŘÍZENÍ', 'AWAITING FULFILMENT') + '</div><h1>' + t('Vyřízení objednávek.', 'Order fulfilment.') + '</h1><h2>' + t('Schvalte, vydejte, hotovo.', 'Approve, issue, done.') + '</h2>' + qa + '</div><div class="tbl" style="margin:18px 22px"><div class="ftr h"><span>' + t('Č.', 'NO.') + '</span><span>' + t('ŽADATEL', 'REQUESTER') + '</span><span>' + t('ÚČEL', 'PURPOSE') + '</span><span>' + t('KS', 'PCS') + '</span><span>' + t('CELKEM', 'TOTAL') + '</span><span></span></div>' +
    frow('f1', 'OBJ-0008', 'Jana Nováková', t('Onboarding nových kolegů', 'Onboarding new colleagues'), '3', '1 270 Kč') + frow('f2', 'OBJ-0007', 'Petr Svoboda', t('Konference v Brně', 'Conference in Brno'), '4', '1 560 Kč') + '</div></div>';

  $('app').innerHTML = sidebar + '<section class="main">' + dash + cat + cart + ord + ful + '</section><div class="toast" id="toast">' + ic(P.chk, 13, '#34E0A1', 2) + '<span id="toastT"></span></div>';

  var box = $('box'), stage = $('stage'), cur = $('cur'), W = 1160, HH = 660, cx = 0, cy = 0;
  function k() { return (box.clientWidth || W) / W; }
  function fit() { var w = box.clientWidth || W, s = w / W; stage.style.transform = 'scale(' + s + ')'; box.style.height = Math.floor(HH * s) + 'px'; }
  fit(); window.addEventListener('resize', fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(box);
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rectOf(el) { var r = el.getBoundingClientRect(), b = stage.getBoundingClientRect(), s = k(); return { x: (r.left - b.left) / s, y: (r.top - b.top) / s, w: r.width / s, h: r.height / s }; }
  function curTo(x, y, ms) { cx = x; cy = y; cur.style.transitionDuration = ms + 'ms'; cur.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }
  async function moveTo(el, fx, fy, ms) { var r = rectOf(el), d = ms || 900; cur.classList.add('on'); curTo(r.x + r.w * (fx == null ? 0.5 : fx), r.y + r.h * (fy == null ? 0.5 : fy), d); await sleep(d + 60); }
  async function click() {
    var r = document.createElement('i'); r.className = 'rip'; r.style.left = cx + 'px'; r.style.top = cy + 'px'; stage.appendChild(r); setTimeout(function () { r.remove(); }, 650);
    cur.classList.add('down'); await sleep(140); cur.classList.remove('down'); await sleep(180);
  }
  var SNAP = $('app').innerHTML;
  var VIEWS = { dash: 'n-dash', cat: 'n-cat', cart: 'n-cart', ord: 'n-ord', ful: 'n-ful' };
  function setView(name) { Object.keys(VIEWS).forEach(function (v) { $('v-' + v).classList.toggle('on', v === name); $(VIEWS[v]).classList.toggle('on', v === name); }); }
  function resetAll() { $('app').innerHTML = SNAP; cur.classList.remove('on', 'down'); curTo(1090, 610, 0); setView('dash'); }
  function toast(tx) { $('toastT').textContent = tx; $('toast').classList.add('on'); }
  var PUR = t('Onboarding nových kolegů', 'Onboarding new colleagues');
  function more() { $('qT').textContent = '3'; $('tT').textContent = '570 Kč'; $('qN').textContent = '4 ' + t('ks', 'pcs'); $('qS').textContent = '1 460 Kč'; $('cK').textContent = '2 ' + t('POLOŽKY · 1 460 KČ', 'ITEMS · CZK 1,460'); }
  function sent() { $('n-cartB').textContent = '0'; $('n-cartB').style.display = 'none'; }
  function approved() { $('f1').style.opacity = '0'; $('f1').style.display = 'none'; $('fK').textContent = '1 ' + t('ČEKÁ NA VYŘÍZENÍ', 'AWAITING FULFILMENT'); }
  async function typeInto(el, txt, per, tk) { el.classList.remove('ph'); el.classList.add('hot'); for (var i = 1; i <= txt.length; i++) { el.innerHTML = '<span class="caret">' + txt.slice(0, i) + '</span>'; await sleep(per); if (tk !== token) return false; } el.textContent = txt; el.classList.remove('hot'); return true; }

  var token = 0, running = false;
  async function play(tk) {
    resetAll(); stage.classList.remove('fade');
    await sleep(2800); if (tk !== token) return;
    await moveTo($('n-cat'), 0.4, 0.5, 900); await click(); setView('cat');
    await sleep(1400); await moveTo($('p2'), 0.5, 0.4, 900); $('p2').classList.add('h');
    await sleep(1300); if (tk !== token) return; $('p2').classList.remove('h');
    await moveTo($('n-cart'), 0.4, 0.5, 900); await click(); setView('cart');
    await sleep(1400); if (tk !== token) return;
    await moveTo($('qPlus'), 0.5, 0.5, 800); await click(); more();
    await sleep(500); await moveTo($('fPur'), 0.3, 0.5, 800); await click();
    if (!(await typeInto($('fPur'), PUR, 45, tk))) return;
    await moveTo($('fDate'), 0.3, 0.5, 700); await click(); $('fDate').classList.add('hot'); await sleep(450); $('tDate').textContent = '12.10.2026'; $('fDate').classList.remove('hot', 'ph');
    await sleep(700); if (tk !== token) return;
    await moveTo($('bSend'), 0.5, 0.5, 800); $('bSend').classList.add('press'); await click(); $('bSend').classList.remove('press');
    sent(); toast(t('Objednávka OBJ-0008 odeslána', 'Order OBJ-0008 submitted')); setView('ord');
    await sleep(2400); $('toast').classList.remove('on'); if (tk !== token) return;
    await moveTo($('n-ful'), 0.4, 0.5, 900); await click(); setView('ful');
    await sleep(1800); if (tk !== token) return;
    await moveTo($('f1A'), 0.5, 0.5, 900); $('f1A').classList.add('press'); await click(); $('f1A').classList.remove('press'); approved(); toast(t('Objednávka schválena · sklad odečten', 'Order approved · stock deducted'));
    await sleep(3000); $('toast').classList.remove('on'); if (tk !== token) return;
    cur.classList.remove('on'); stage.classList.add('fade'); await sleep(650); if (tk !== token) return;
    resetAll(); await sleep(150); stage.classList.remove('fade'); await sleep(300);
  }
  async function loop() { var tk = ++token; while (tk === token) await play(tk); }
  function start() { if (!running) { running = true; loop(); } }
  function stop() { if (running) { running = false; token++; stage.classList.remove('fade'); resetAll(); } }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setView('dash');
  var hash = location.hash;
  if (hash === '#dash') return;
  if (hash === '#cat') { setView('cat'); $('p2').classList.add('h'); return; }
  if (hash === '#cart') { setView('cart'); return; }
  if (hash === '#cart2') { setView('cart'); more(); $('fPur').classList.remove('ph'); $('fPur').textContent = PUR; $('tDate').textContent = '12.10.2026'; $('fDate').classList.remove('ph'); return; }
  if (hash === '#ord') { setView('ord'); return; }
  if (hash === '#ful') { setView('ful'); return; }
  if (hash === '#ful2') { setView('ful'); approved(); toast(t('Objednávka schválena · sklad odečten', 'Order approved · stock deducted')); return; }
  if (reduce) return;
  if (EMBED) {
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.ep365anim === undefined) return;
      if (e.data.ep365anim === 'play') start(); else stop();
    });
    window.parent.postMessage({ ep365animReady: true }, '*');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) start(); else stop(); }); }, { threshold: 0.35 }).observe(box);
  } else { start(); }
})();
</script>
