  :root { --navy:#002163; --teal:#15C6D4; --teal7:#00A8B0; --tealb:#00CED7; --muted:#4A5874; --soft:#7A8499; --line:#E0E6EF; --mint:#E4F7F6; --red:#D14343; --green:#34B36A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }

  .stage-box { position:relative; width:100%; overflow:hidden; border-radius:14px; background:#fff; box-shadow:0 24px 60px -24px rgba(0,33,99,.35), 0 0 0 1px rgba(0,33,99,.08); }

  .app { display:flex; height:626px; position:relative; overflow:hidden; }
  .sb { width:208px; flex:none; background:#FBFCFE; border-right:1px solid var(--line); padding:14px 10px 0; }
  .brand { display:flex; gap:10px; align-items:center; margin:0 4px 14px; }

  .brand b { display:block; font-family:Manrope,sans-serif; font-weight:800; font-size:13px; } .brand span { display:block; font-family:"JetBrains Mono",monospace; font-size:7.5px; letter-spacing:.12em; color:var(--soft); margin-top:2px; line-height:1.4; }
  .ssearch { height:28px; border:1px solid var(--line); border-radius:9px; background:#fff; display:flex; align-items:center; gap:7px; padding:0 9px; font-size:10.5px; color:var(--soft); margin-bottom:12px; }
  .ssearch kbd { margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:8px; background:#EAEFF6; color:var(--muted); border-radius:4px; padding:1px 5px; }
  .si { display:flex; align-items:center; gap:10px; height:30px; padding:0 10px; border-radius:8px; font-size:12px; color:var(--muted); font-weight:500; white-space:nowrap; margin-bottom:3px; }
  .si.on { background:var(--mint); color:var(--navy); font-weight:700; } .si.on svg { stroke:#00A8B0; }
  .main { flex:1; min-width:0; background:#F3F6FB; overflow:hidden; position:relative; }
  .pg { transition:transform 1.2s cubic-bezier(.45,.05,.25,1); display:none; } .pg.on { display:block; }

    background-image:linear-gradient(rgba(0,33,99,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,33,99,.03) 1px,transparent 1px); background-size:26px 26px; }
  .head.hero { height:206px; } .head.tall { height:208px; }

  .chip.gr { background:#E1F5E9; border-color:#C4E9D2; color:#1a8a5a; } .chip.am { background:#FFF6E0; border-color:#F3DFA7; color:#9A6A08; }
  .fl { position:absolute; width:218px; height:48px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 20px -12px rgba(0,33,99,.25); display:flex; align-items:center; gap:10px; padding:0 12px; }
  .fl i { width:28px; height:28px; border-radius:8px; background:#D9F4F6; display:grid; place-items:center; flex:none; }
  .fl b { display:block; font-family:Manrope,sans-serif; font-weight:800; font-size:13px; line-height:1.2; } .fl span { display:block; font-family:"JetBrains Mono",monospace; font-size:7.5px; color:var(--soft); letter-spacing:.02em; }
  .btnrow { display:flex; gap:9px; align-items:center; margin-top:12px; }

  .ch { display:flex; align-items:center; gap:11px; padding:14px 18px; border-bottom:1px solid #EEF2F7; font-family:Manrope,sans-serif; font-weight:800; font-size:13.5px; } .ch .tile { width:26px; height:26px; border-radius:8px; background:#D9F4F6; display:grid; place-items:center; }

  .ta { height:56px; border:1px solid #D5DCE8; border-radius:9px; padding:9px 11px; font-size:10.5px; margin-top:0; color:var(--navy); }

  .btns { display:flex; align-items:center; gap:12px; margin-top:12px; }

  .cbx { display:flex; align-items:center; gap:7px; font-size:10.5px; color:var(--muted); } .cbx i { width:14px; height:14px; border-radius:3px; background:#00A8B0; display:grid; place-items:center; }
  .cal { height:32px; padding:0 14px; border:1px solid #D5DCE8; border-radius:999px; font-size:10.5px; font-weight:600; display:flex; align-items:center; gap:6px; }

  .mh .tile { width:26px; height:26px; border-radius:8px; background:#D9F4F6; display:grid; place-items:center; }
  .mr { margin-left:auto; display:flex; align-items:center; gap:9px; font-family:"Plus Jakarta Sans",sans-serif; }
  .sel { height:28px; border:1px solid #D5DCE8; border-radius:999px; padding:0 13px; font-size:10.5px; font-weight:600; display:flex; align-items:center; gap:14px; background:#fff; }
