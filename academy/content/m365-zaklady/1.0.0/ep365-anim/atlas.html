  :root { --navy:#002163; --teal:#15C6D4; --teal7:#00A8B0; --tealb:#00CED7; --muted:#4A5874; --soft:#7A8499; --line:#E0E6EF; --mint:#E4F7F6; --red:#D14343; --green:#34B36A; --amber:#E6A23C; }
  * { box-sizing:border-box; margin:0; padding:0; }

  .chips { display:flex; gap:8px; align-items:center; margin-top:10px; } .chips em { font-family:"JetBrains Mono",monospace; font-style:normal; font-size:8px; letter-spacing:.16em; color:var(--soft); }

  .fl { position:absolute; width:212px; height:46px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 20px -12px rgba(0,33,99,.25); display:flex; align-items:center; gap:10px; padding:0 11px; }
  .fl i { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none; }
  .fl b { display:block; font-family:Manrope,sans-serif; font-weight:800; font-size:11.5px; } .fl span { display:block; font-family:"JetBrains Mono",monospace; font-size:7.5px; color:var(--soft); }

  .health { display:grid; grid-template-columns:110px 1fr; gap:20px; padding:10px 18px 18px; align-items:center; } .gauge { position:relative; width:104px; height:104px; } .gauge svg { transform:rotate(-90deg); } .gauge circle { fill:none; stroke-width:9; } .gauge .bg { stroke:#E7ECF3; } .gauge .fg { stroke:#D14343; stroke-linecap:round; stroke-dasharray:0 300; transition:stroke-dasharray 1.6s cubic-bezier(.3,.6,.3,1); } .gauge .nm { position:absolute; inset:0; display:grid; place-items:center; text-align:center; } .gauge .nm b { font-family:Manrope,sans-serif; font-weight:800; font-size:27px; display:block; line-height:1; } .gauge .nm small { font-family:"JetBrains Mono",monospace; font-size:7px; color:var(--soft); }
