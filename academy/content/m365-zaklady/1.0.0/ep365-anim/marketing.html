  :root { --navy:#002163; --teal:#15C6D4; --teal7:#00A8B0; --tealb:#00CED7; --muted:#4A5874; --soft:#7A8499; --line:#E0E6EF; --mint:#E4F7F6; --red:#D14343; --green:#34B36A; --amber:#E6A23C; }
  * { box-sizing:border-box; margin:0; padding:0; }

  .stage-box { position:relative; width:100%; overflow:hidden; border-radius:14px; background:#fff; box-shadow:0 24px 60px -24px rgba(0,33,99,.35), 0 0 0 1px rgba(0,33,99,.08); }

  .app { display:flex; height:626px; position:relative; overflow:hidden; }
  .sb { width:208px; flex:none; background:#FBFCFE; border-right:1px solid var(--line); padding:14px 10px 0; }

  .brand b { display:block; font-family:Manrope,sans-serif; font-weight:800; font-size:13px; } .brand span { display:block; font-family:"JetBrains Mono",monospace; font-size:7.5px; letter-spacing:.12em; color:var(--soft); margin-top:2px; line-height:1.4; }

  .ssearch kbd { margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:8px; background:#EAEFF6; color:var(--muted); border-radius:4px; padding:1px 5px; }
  .sh { font-family:"JetBrains Mono",monospace; font-size:7.5px; letter-spacing:.16em; color:var(--soft); margin:14px 8px 5px; }
  .si { display:flex; align-items:center; gap:10px; height:30px; padding:0 10px; border-radius:8px; font-size:12px; color:var(--muted); font-weight:500; white-space:nowrap; margin-bottom:3px; }

  .seg { display:flex; background:#E8EEF6; border-radius:999px; padding:2px; font-size:10px; font-weight:600; } .seg span { padding:5px 11px; border-radius:999px; color:var(--soft); } .seg span.on { background:#fff; color:var(--navy); }
  .sel { height:28px; border:1px solid #D5DCE8; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:0 11px; font-size:10.5px; font-weight:600; }
  .lab { font-family:"JetBrains Mono",monospace; font-size:7.5px; letter-spacing:.12em; color:var(--soft); margin-right:4px; }
  .row2 { display:flex; align-items:center; gap:10px; margin:10px 22px 0; }

  .wk { display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid #EEF2F7; height:86px; } .dy { border-left:1px solid #EEF2F7; padding:5px 6px; font-family:"JetBrains Mono",monospace; font-size:8.5px; color:var(--soft); position:relative; overflow:hidden; } .dy:first-child { border-left:0; } .dy.o { background:#F7F9FC; color:#B9C3D3; } .dy.td { background:#EAF9FA; } .dy.td b { color:#0e8f98; }

  .pc b { display:block; font-size:9px; color:var(--navy); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .pc small { font-family:"JetBrains Mono",monospace; font-size:7px; color:var(--soft); display:block; } .pc .st { display:flex; align-items:center; gap:4px; font-size:7.5px; color:var(--muted); margin-top:1px; } .pc .st i { width:5px; height:5px; border-radius:50%; background:var(--c,#00A8B0); }

  .ev { margin-top:4px; border:1px dashed #C7D0DC; border-left:3px solid #002163; border-radius:6px; padding:3px 6px; font-size:8.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#fff; } .ev small { font-family:"JetBrains Mono",monospace; font-weight:500; color:var(--soft); margin-right:4px; }
  /* kanban */
  .srow { display:flex; align-items:center; gap:8px; margin:14px 22px 0; }

  .kc { background:#E9EEF6; border-radius:12px; padding:10px 8px 8px; min-height:120px; }

  $('app').innerHTML = sidebar + '<section class="main">' + cal + posts + '</section>' + blade;

  var box = $('box'), stage = $('stage'), cur = $('cur'), W = 1160, HH = 660, cx = 0, cy = 0;
  function k() { return (box.clientWidth || W) / W; }
  function fit() { var w = box.clientWidth || W, s = w / W; stage.style.transform = 'scale(' + s + ')'; box.style.height = Math.floor(HH * s) + 'px'; }
  fit(); window.addEventListener('resize', fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(box);
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rectOf(el) { var r = el.getBoundingClientRect(), b = stage.getBoundingClientRect(), s = k(); return { x: (r.left - b.left) / s, y: (r.top - b.top) / s, w: r.width / s, h: r.height / s }; }
  function curTo(x, y, ms) { cx = x; cy = y; cur.style.transitionDuration = ms + 'ms'; cur.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }
  async function moveTo(el, fx, fy, ms) { var r = rectOf(el), d = ms || 900; cur.classList.add('on'); curTo(r.x + r.w * (fx == null ? 0.5 : fx), r.y + r.h * (fy == null ? 0.5 : fy), d); await sleep(d + 60); }
  async function click() {
    var r = document.createElement('i'); r.className = 'rip'; r.style.left = cx + 'px'; r.style.top = cy + 'px'; stage.appendChild(r); setTimeout(function () { r.remove(); }, 650);
    cur.classList.add('down'); await sleep(140); cur.classList.remove('down'); await sleep(180);
  }
  var SNAP = $('app').innerHTML;
  var VIEWS = { cal: 'n-cal', posts: 'n-posts' };
  function setView(name) {
    Object.keys(VIEWS).forEach(function (v) { var pg = $('v-' + v); pg.classList.toggle('on', v === name); $(VIEWS[v]).classList.toggle('on', v === name); });
  }
  function resetAll() { $('app').innerHTML = SNAP; cur.classList.remove('on', 'down'); curTo(1090, 610, 0); setView('cal'); }
  function showCards(instant) { Array.prototype.forEach.call(document.querySelectorAll('#v-cal .pc'), function (c, i) { if (instant) { c.style.transition = 'none'; c.classList.add('in'); } else setTimeout(function () { c.classList.add('in'); }, 120 * i); }); }
  function openBlade() { $('dim').classList.add('on'); $('blade').classList.add('on'); }
  function closeBlade() { $('dim').classList.remove('on'); $('blade').classList.remove('on'); }
  function step1() { $('n1').classList.remove('now'); $('n1').classList.add('done'); $('n2').classList.add('now'); $('s1').textContent = t('schváleno · Jana Nováková', 'approved · Jana Nováková'); $('stpT').textContent = t('SCHVALOVÁNÍ · KROK 2 Z 2', 'APPROVAL · STEP 2 OF 2'); $('bAprT').textContent = t('Schválit (krok 2/2)', 'Approve (step 2/2)'); }
  function step2() { $('n2').classList.remove('now'); $('n2').classList.add('done'); $('s2').textContent = t('schváleno · Martin Dlouhý', 'approved · Martin Dlouhý'); $('sp').textContent = t('SCHVÁLENO', 'APPROVED'); $('sp').classList.add('ok'); $('bSt').textContent = t('SCHVÁLENO', 'APPROVED'); $('bApr').style.display = 'none'; $('bRet').style.display = 'none'; $('stpT').textContent = t('SCHVALOVÁNÍ · HOTOVO', 'APPROVAL · DONE'); }
  function moveCard() { var c = $('kWeb'); c.parentNode.removeChild(c); c.classList.add('flash'); $('c4').insertBefore(c, $('c4').firstChild); $('c3').previousSibling.lastChild.textContent = '1'; $('c4').previousSibling.lastChild.textContent = '3'; }

  var token = 0, running = false;
  async function play(tk) {
    resetAll(); stage.classList.remove('fade');
    await sleep(700); showCards(false); await sleep(2800); if (tk !== token) return;
    await moveTo($('n-posts'), 0.4, 0.5, 1000); await click(); setView('posts');
    await sleep(2000); if (tk !== token) return;
    await moveTo($('kWeb'), 0.5, 0.5, 1000); await click(); openBlade();
    await sleep(2400); if (tk !== token) return;
    await moveTo($('bApr'), 0.5, 0.5, 900); $('bApr').classList.add('press'); await click(); $('bApr').classList.remove('press'); step1();
    await sleep(1500); if (tk !== token) return;
    $('bApr').classList.add('press'); await click(); $('bApr').classList.remove('press'); step2();
    await sleep(1800); if (tk !== token) return;
    await moveTo($('bX').firstChild, 0.5, 0.5, 800); await click(); closeBlade();
    await sleep(700); moveCard();
    await sleep(3200); if (tk !== token) return;
    cur.classList.remove('on'); stage.classList.add('fade'); await sleep(650); if (tk !== token) return;
    resetAll(); await sleep(150); stage.classList.remove('fade'); await sleep(300);
  }
  async function loop() { var tk = ++token; while (tk === token) await play(tk); }
  function start() { if (!running) { running = true; loop(); } }
  function stop() { if (running) { running = false; token++; stage.classList.remove('fade'); resetAll(); } }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setView('cal');
  var hash = location.hash;
  function noTr(el) { el.style.transition = 'none'; void el.offsetWidth; }
  if (hash === '#cal') { showCards(true); return; }
  if (hash === '#posts') { setView('posts'); return; }
  if (hash === '#blade' || hash === '#blade2' || hash === '#moved') {
    setView('posts'); noTr($('blade')); noTr($('dim')); openBlade();
    if (hash === '#blade2') { step1(); }
    if (hash === '#moved') { step1(); step2(); closeBlade(); moveCard(); }
    return;
  }
  if (reduce) { showCards(true); return; }
  if (EMBED) {
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.ep365anim === undefined) return;
      if (e.data.ep365anim === 'play') start(); else stop();
    });
    window.parent.postMessage({ ep365animReady: true }, '*');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) start(); else stop(); }); }, { threshold: 0.35 }).observe(box);
  } else { start(); }
})();
