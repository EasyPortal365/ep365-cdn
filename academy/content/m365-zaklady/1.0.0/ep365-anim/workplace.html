  :root { --navy:#002163; --teal:#15C6D4; --teal7:#00A8B0; --tealb:#00CED7; --muted:#4A5874; --soft:#7A8499; --line:#E0E6EF; --mint:#E4F7F6; --kick:#1FB8AE; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }
  html, body { overflow:hidden; }
  body { font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; color:var(--navy); }
  .stage-box { position:relative; width:100%; overflow:hidden; border-radius:14px; background:#fff; box-shadow:0 24px 60px -24px rgba(0,33,99,.35), 0 0 0 1px rgba(0,33,99,.08); }
  html.embed .stage-box { box-shadow:none; border-radius:0; }
  .stage { position:absolute; left:0; top:0; width:1160px; height:660px; transform-origin:0 0; background:#fff; overflow:hidden; transition:opacity .5s; }
  .stage.fade { opacity:0; }
  .suite { height:34px; background:#0078D4; display:flex; align-items:center; padding:0 12px; font-family:"Segoe UI",system-ui,sans-serif; color:#fff; position:relative; z-index:3; }
  .suite .search { position:absolute; left:50%; transform:translateX(-50%); width:330px; height:22px; background:#fff; border-radius:3px; color:#605E5C; font-size:11.5px; display:flex; align-items:center; gap:8px; padding:0 10px; }
  .suite .r { margin-left:auto; display:flex; gap:16px; align-items:center; }
  .suite .av { width:22px; height:22px; border-radius:50%; background:#DDE3EC; color:#0B3D91; font-size:9px; font-weight:600; display:grid; place-items:center; }
  .view { height:626px; overflow:clip; position:relative; background:#fff; }
  .page { padding:16px 14px 40px; transition:transform 1.5s cubic-bezier(.45,.05,.25,1); will-change:transform; }
  .page.instant { transition:none; }

  /* Hero */
  .hero { position:relative; height:300px; border-radius:16px; color:#fff; padding:0 49px;
    background:radial-gradient(120% 140% at 85% 0%,rgba(0,206,215,.18),transparent 55%),linear-gradient(115deg,#0a2a63 0%,#0b3f7d 55%,#0a4f8f 100%); overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(120deg,rgba(255,255,255,.035) 0 2px,transparent 2px 34px); pointer-events:none; }
  .hrow1 { position:absolute; left:49px; right:43px; top:22px; display:flex; align-items:center; justify-content:space-between; }
  .hsearch { width:265px; height:30px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); display:flex; align-items:center; gap:8px; padding:0 12px; font-size:11.5px; color:#fff; }
  .hsearch kbd { margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:8.5px; background:rgba(255,255,255,.2); border-radius:4px; padding:1px 5px; }
  .hnav { display:flex; align-items:center; gap:2px; height:34px; padding:0 5px; border-radius:20px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); }
  .hp { display:flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:999px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.85); white-space:nowrap; }
  .hp.on { background:var(--tealb); color:var(--navy); font-weight:700; }
  .bdg { min-width:20px; height:15px; border-radius:8px; font-size:9.5px; font-weight:700; display:grid; place-items:center; padding:0 5px; color:#fff; }
  .bdg.red { background:#D14343; } .bdg.teal { background:#5BE2E6; color:#00434a; } .bdg.w { background:rgba(255,255,255,.22); }
  .hrow2 { position:absolute; left:49px; right:43px; top:82px; display:flex; align-items:center; justify-content:space-between; }
  .hdate { font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.18em; color:#5BE2E6; }
  .hdate b { color:#fff; font-weight:500; letter-spacing:.06em; margin-left:10px; }
  .hicons { display:flex; gap:8px; align-items:center; }
  .hic { width:26px; height:26px; border-radius:50%; border:1px solid rgba(255,255,255,.3); display:grid; place-items:center; background:rgba(255,255,255,.06); }
  .hsep { width:1px; height:16px; background:rgba(255,255,255,.3); }
  .hh1 { position:absolute; left:49px; top:116px; font-family:Manrope,"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:44px; letter-spacing:-.03em; line-height:1.1; }
  .hh1 i { font-family:Fraunces,Georgia,serif; font-style:italic; font-weight:600; color:transparent; -webkit-text-stroke:1.2px #4FE3E8; letter-spacing:-.04em; }
  .hsub { position:absolute; left:49px; top:179px; font-size:13px; color:#fff; opacity:.95; }

  /* headline card */
  .hcard { position:relative; display:flex; margin:-92px 39px 0; height:283px; background:#fff; border-radius:14px; border:1px solid var(--line); box-shadow:0 24px 48px -16px rgba(11,30,63,.18), 0 6px 14px -6px rgba(11,30,63,.1); overflow:hidden; }
  .hcard .tx { flex:1; padding:32px 40px 26px; display:flex; flex-direction:column; }
  .chips { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .chip1 { font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.14em; color:#008a91; background:#DDF7F8; border:1px solid rgba(0,206,215,.4); border-radius:999px; padding:3px 10px 3px 8px; display:flex; align-items:center; gap:5px; }
  .chip1::before { content:""; width:5px; height:5px; border-radius:50%; background:#00CED7; }
  .chip2 { font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.14em; color:#33456B; background:#E6ECF5; border-radius:999px; padding:3px 10px; }
  .chipd { font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.14em; color:var(--soft); }
  .hcard h3 { font-family:Manrope,"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:33px; letter-spacing:-.03em; line-height:1.1; margin-bottom:12px; max-width:520px; }
  .hcard p { font-size:12.5px; line-height:1.55; color:var(--muted); max-width:470px; }
  .auth { display:flex; align-items:center; gap:10px; }
  .av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#0a4f8f,#00B5BD); color:#fff; font-size:10.5px; font-weight:700; display:grid; place-items:center; flex:none; }
  .auth b { display:block; font-size:12px; } .auth span { font-size:10.5px; color:var(--soft); }
  .cta { margin-left:auto; height:32px; padding:0 18px; border-radius:999px; background:var(--navy); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; gap:7px; }
  .hcard .im { width:438px; flex:none; position:relative; }

  /* generic sections */
  .sh { display:flex; align-items:center; gap:9px; margin:0; font-family:Manrope,"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:17px; letter-spacing:-.01em; }
  .sh small { font-family:"JetBrains Mono",monospace; font-weight:500; font-size:8.5px; letter-spacing:.2em; color:var(--soft); margin-left:2px; }
  .shrow { display:flex; align-items:center; justify-content:space-between; }
  .lnk { font-size:11px; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:4px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; }
  .qa { margin-top:14px; padding:14px; display:grid; grid-template-columns:repeat(5,1fr); gap:11px; }
  .qt { display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#fff; height:63px; }
  .qi { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex:none; }
  .qt b { display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .qt span { display:block; font-size:10.5px; color:var(--soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; margin-top:1px; }
  .qt .ch { margin-left:auto; }
  .kick { display:flex; align-items:center; gap:14px; margin:26px 0 22px; font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.22em; color:var(--kick); }
  .kick::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,#CFD8E5,rgba(207,216,229,0)); }
  .g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .tag { display:inline-block; font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.1em; color:#33707a; background:#E3F4F6; border-radius:5px; padding:2px 7px; }
  .meta { font-family:"JetBrains Mono",monospace; font-size:9px; color:var(--soft); }
  .big { grid-row:span 2; overflow:hidden; display:flex; flex-direction:column; }
  .big .im { height:176px; position:relative; }
  .big .bd { padding:16px 18px 16px; display:flex; flex-direction:column; flex:1; }
  .big h4 { font-family:Manrope,"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:17px; letter-spacing:-.02em; margin:10px 0 8px; }
  .big p { font-size:11.5px; line-height:1.55; color:var(--muted); }
  .big .auth { margin-top:auto; padding-top:12px; }
  .big .av { width:26px; height:26px; font-size:8.5px; }
  .big .auth b { font-size:11px; display:inline; } .big .auth span { font-size:10.5px; }
  .sm { display:flex; overflow:hidden; height:170px; }
  .sm.s2 { height:122px; }
  .sm .im { width:106px; flex:none; position:relative; }
  .sm .bd { padding:14px 14px 12px; display:flex; flex-direction:column; min-width:0; }
  .sm h5 { font-size:13px; font-weight:700; margin-bottom:6px; }
  .sm p { font-size:10.5px; line-height:1.5; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .sm .meta { margin-top:auto; }
  .links { padding:14px; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .lk { display:flex; align-items:center; gap:9px; background:#F1F6FC; border-radius:10px; padding:0 10px; height:37px; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; }
  .lk i { width:24px; height:24px; border-radius:8px; background:#D6F3F5; display:grid; place-items:center; flex:none; }
  .evs { margin-top:12px; overflow:hidden; }
  .ev { display:flex; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid #EEF2F7; height:64px; }
  .ev:last-child { border-bottom:0; }
  .dbox { width:46px; height:44px; border-radius:10px; background:#EDF4FB; text-align:center; padding-top:4px; flex:none; }
  .dbox b { display:block; font-family:Manrope,sans-serif; font-weight:800; font-size:17px; line-height:1.15; }
  .dbox span { font-family:"JetBrains Mono",monospace; font-size:8px; color:var(--teal7); letter-spacing:.08em; }
  .ev .t b { display:block; font-size:12px; } .ev .t span { display:block; margin-top:3px; font-family:"JetBrains Mono",monospace; font-size:9px; color:var(--soft); }
  .ev .ci { margin-left:auto; width:26px; height:26px; border:1px solid rgba(0,181,189,.4); border-radius:8px; display:grid; place-items:center; }
  .eq > div { display:flex; flex-direction:column; } .eq .card { flex:1; height:auto; } .eq .safe, .eq .pc { height:auto; }
  .lk span { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .lead { overflow:hidden; margin-top:14px; }
  .lead .vid { height:117px; background:linear-gradient(135deg,#0a2a63,#0b6fa8 55%,#00C2CC); display:grid; place-items:center; }
  .play { width:46px; height:46px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 8px 20px -8px rgba(0,0,0,.4); }
  .lead .bd { padding:18px 20px 18px; }
  .lead .mk { font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.2em; color:var(--soft); }
  .lead h4 { font-family:Manrope,sans-serif; font-weight:800; font-size:17px; letter-spacing:-.02em; margin:10px 0 8px; }
  .lead p { font-size:11.5px; line-height:1.55; color:var(--muted); }
  .lead .auth { margin-top:14px; } .lead .av { width:30px; height:30px; font-size:9.5px; }
  .safe { margin-top:14px; text-align:center; padding:26px 22px 22px; position:relative; overflow:hidden; height:340px; }
  .safe .pill { display:inline-flex; align-items:center; gap:6px; font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.14em; color:#1a8a5a; background:#E7F7EE; border:1px solid rgba(52,179,106,.35); border-radius:999px; padding:3px 11px; }
  .safe .pill::before { content:""; width:5px; height:5px; border-radius:50%; background:#34B36A; }
  .safe .num { font-family:Manrope,sans-serif; font-weight:800; font-size:66px; letter-spacing:-.04em; line-height:1; margin-top:14px; }
  .safe .cap { font-weight:700; font-size:14px; margin-top:6px; } .safe .since { font-size:11px; color:var(--soft); margin-top:5px; }
  .safe .goal { display:flex; justify-content:space-between; font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.1em; color:var(--soft); margin-top:22px; }
  .safe .goal b { color:var(--teal7); font-weight:500; }
  .safe .bar { height:6px; border-radius:3px; background:#E8EEF5; margin-top:6px; overflow:hidden; } .safe .bar i { display:block; height:100%; width:33%; background:linear-gradient(90deg,var(--teal7),#2ED7DE); border-radius:3px; }
  .safe .rest { text-align:left; font-size:10.5px; color:var(--soft); margin-top:6px; }
  .safe .sh-bg { position:absolute; right:-6px; top:-10px; opacity:.5; }

      '<div class="evr">' + ic(P.cal, 14, '#00A8B0', 1.5) + '<span>' + t('Čtvrtek 1. října 2026 · 10:00–15:00', 'Thursday 1 October 2026 · 10:00–15:00') + '</span></div><div class="evr">' + ic('<rect x="3.500" y="2" width="9" height="12" rx="1"/><path d="M6 5h1M9 5h1M6 8h1M9 8h1M7 14v-2.500h2V14"/>', 14, '#00A8B0', 1.4) + '<span>' + t('Park Stromovka', 'Stromovka Park') + '</span></div><hr>' +
      '<div class="evb"><span class="evp">' + ic(P.cal, 13, '#fff', 1.6) + ' ' + t('Přidat do Outlooku', 'Add to Outlook') + '</span><span class="evg">' + t('Stáhnout .ics', 'Download .ics') + '</span></div>' +

    '<div class="blade" id="blade"><div class="bh"><span class="bi">' + ic('<circle cx="8" cy="8" r="2.500"/><path d="M8 1.500v2M8 12.500v2M1.500 8h2M12.500 8h2M3.400 3.400l1.400 1.400M11.200 11.200l1.400 1.400M12.600 3.400l-1.400 1.400M4.800 11.200l-1.400 1.400"/>', 17, '#00A8B0', 1.4) + '</span><div><div class="bk1">' + t('NASTAVENÍ SEKCE', 'SECTION SETTINGS') + '</div><div class="bt">' + t('Aktuality', 'News') + '</div></div><span class="bx" id="bladeX">' + X + '</span></div>' +
      '<div class="bsc"><div class="bin" id="bin"><div class="lab">' + t('Název sekce', 'Section name') + '</div><div class="inp">' + t('Aktuality', 'News') + '</div><div class="hint">' + t('Prázdné = výchozí název sekce. (Sekce bez nadpisu, např. Pozdrav, změnu neukáže.) Nezapomeňte uložit.', 'Empty = default section name. (Sections without a heading, e.g. Greeting, will not show the change.) Remember to save.') + '</div>' +

      '<div class="bbar" id="bbar"><span class="gh">' + t('Zrušit', 'Cancel') + '</span><span class="pr" id="pub">' + t('Publikovat aktualitu', 'Publish article') + '</span></div>' +
      '<div class="bft"><span class="gh" id="bclose">' + t('Zavřít', 'Close') + '</span></div></div>';

  function k() { return (box.clientWidth || W) / W; }
  function rectOf(el) { var r = el.getBoundingClientRect(), b = stage.getBoundingClientRect(), s = k(); return { x: (r.left - b.left) / s, y: (r.top - b.top) / s, w: r.width / s, h: r.height / s }; }
  function curTo(x, y, ms) { cx = x; cy = y; cur.style.transitionDuration = ms + 'ms'; cur.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }
  async function moveTo(el, fx, fy, ms) { var r = rectOf(el), d = ms || 900; cur.classList.add('on'); curTo(r.x + r.w * (fx == null ? 0.5 : fx), r.y + r.h * (fy == null ? 0.5 : fy), d); await sleep(d + 60); }
  async function click() {
    var r = document.createElement('i'); r.className = 'rip'; r.style.left = cx + 'px'; r.style.top = cy + 'px'; stage.appendChild(r); setTimeout(function () { r.remove(); }, 650);
    cur.classList.add('down'); await sleep(140); cur.classList.remove('down'); await sleep(200);
  }
  function fld(id, txt) { var e = $(id); e.classList.add('fill'); e.innerHTML = '<span>' + txt + '</span>'; return e.firstChild; }

  function resetScenes() {
    ['bkArt', 'bkEv', 'blade'].forEach(function (i) { $(i).classList.remove('on'); });
    $('artIn').style.transform = ''; cur.classList.remove('on', 'down'); curTo(1090, 610, 0);
    var g = page.querySelector('[data-t=gear]'); if (g) g.classList.remove('show');
  }

  async function sceneArticle(tk) {
    await moveTo(page.querySelector('[data-t=bigcard]'), 0.5, 0.75); if (tk !== token) return;
    await click(); $('bkArt').classList.add('on');
    await sleep(1300); if (tk !== token) return;
    $('artIn').style.transform = 'translateY(-150px)';
    await sleep(2800); if (tk !== token) return;
    await moveTo($('artX'), 0.5, 0.5, 800); await click();
    $('bkArt').classList.remove('on'); await sleep(600);
  }
  async function sceneEvent(tk) {
    await moveTo(page.querySelector('[data-t=ev0]'), 0.35, 0.5); if (tk !== token) return;
    await click(); $('bkEv').classList.add('on');
    await sleep(2800); if (tk !== token) return;
    await moveTo($('evX'), 0.5, 0.5, 800); await click();
    $('bkEv').classList.remove('on'); await sleep(600);
  }
  async function typeInto(el, txt, per, tk) {
    for (var i = 1; i <= txt.length; i++) { el.textContent = txt.slice(0, i); await sleep(per); if (tk !== token) return false; }
    return true;
  }
  async function streamWords(el, txt, per, tk) {
    var w = txt.split(' '), acc = '';
    for (var i = 0; i < w.length; i++) { acc += (i ? ' ' : '') + w[i]; el.textContent = acc; await sleep(per); if (tk !== token) return false; }
    return true;
  }
  async function sceneCreate(tk) {
    var head = page.querySelector('[data-t=newshead]'), gear = page.querySelector('[data-t=gear]');
    await moveTo(head, 0.6, 0.5); if (tk !== token) return;
    gear.classList.add('show'); await sleep(450);
    await moveTo(gear, 0.5, 0.5, 600); await click(); if (tk !== token) return;
    $('bview').innerHTML = LIST; $('bbar').classList.remove('on'); $('bin').style.transform = '';
    $('blade').classList.add('on'); gear.classList.remove('show');
    await sleep(1700); if (tk !== token) return;
    await moveTo($('newBtn'), 0.5, 0.5, 900); await click();
    $('bview').innerHTML = EDIT; $('bbar').classList.add('on'); $('bin').style.transform = 'translateY(-176px)';
    await sleep(1400); if (tk !== token) return;
    await moveTo($('aiTa'), 0.4, 0.4, 900); await click();
    var ta = $('aiTa'); ta.innerHTML = '<span></span>'; ta.classList.add('typing');
    if (!(await typeInto(ta.firstChild, GEN.prompt, 28, tk))) return;
    ta.classList.remove('typing'); $('aiGen').classList.add('rdy');
    await sleep(600); if (tk !== token) return;
    await moveTo($('aiGen'), 0.5, 0.5, 800); await click();
    $('aiGen').classList.add('busy'); await sleep(1100); if (tk !== token) return;
    $('aiGen').classList.remove('busy');
    var e1 = fld('tTitle', ''); if (!(await typeInto(e1, GEN.title, 22, tk))) return;
    var e2 = fld('tPerex', ''); if (!(await streamWords(e2, GEN.perex, 32, tk))) return;
    var eb = $('tBody'); eb.classList.add('fill'); eb.innerHTML = '';
    for (var i = 0; i < GEN.body.length; i++) {
      var p = document.createElement('p'); eb.appendChild(p);
      if (!(await streamWords(p, GEN.body[i], 22, tk))) return;
    }
    [].forEach.call(document.querySelectorAll('.lg i'), function (d) { d.classList.add('ok'); });
    $('aiChips').classList.add('on'); $('aiNote').classList.add('on');
    await sleep(2600); if (tk !== token) return;
    await moveTo($('pub'), 0.5, 0.5, 900); await click();
    $('blade').classList.remove('on'); await sleep(700); if (tk !== token) return;
    var big = page.querySelector('[data-t=bigcard]');
    big.querySelector('h4').textContent = GEN.title;
    big.querySelector('p').textContent = GEN.perex;
    big.querySelector('.im').innerHTML = pic('board');
    big.querySelector('.tag').textContent = 'HR';
    big.classList.add('flash');
    await sleep(2200);
  }

  function showStatic(name) {
    var st = stops();
    if (name === 'art') { goto(st[2], true); $('bkArt').classList.add('on'); $('artIn').style.transform = 'translateY(-150px)'; }
    else if (name === 'ev') { goto(st[2], true); $('bkEv').classList.add('on'); }
    else if (name === 'blade') { $('bview').innerHTML = LIST; $('blade').classList.add('on'); }
    else if (name === 'edit' || name === 'gen') {
      $('bview').innerHTML = EDIT; $('bbar').classList.add('on'); $('bin').style.transform = 'translateY(-176px)'; $('blade').classList.add('on');
      if (name === 'gen') {
        $('aiTa').innerHTML = '<span>' + GEN.prompt + '</span>'; $('aiGen').classList.add('rdy');
        fld('tTitle', GEN.title); fld('tPerex', GEN.perex); $('tBody').classList.add('fill'); $('tBody').innerHTML = GEN.body.map(function (b) { return '<p>' + b + '</p>'; }).join('');
        [].forEach.call(document.querySelectorAll('.lg i'), function (d) { d.classList.add('ok'); });
        $('aiChips').classList.add('on'); $('aiNote').classList.add('on');
      }
    }
  }

  async function play(tk) {
    var st = stops();
    page.innerHTML = html; resetScenes(); st = stops();
    goto(0, true); stage.classList.remove('fade');
    await sleep(2600); if (tk !== token) return;
    goto(st[1]); await sleep(3000); if (tk !== token) return;
    goto(st[2]); await sleep(2000); if (tk !== token) return;
    await sceneArticle(tk); if (tk !== token) return;
    await sceneEvent(tk); if (tk !== token) return;
    await sceneCreate(tk); if (tk !== token) return;
    cur.classList.remove('on');
    goto(st[3]); await sleep(1500 + 3000); if (tk !== token) return;
    goto(st[4]); await sleep(1500 + 2600); if (tk !== token) return;
    stage.classList.add('fade');
    await sleep(600); if (tk !== token) return;
    goto(0, true);
    await sleep(120);
    stage.classList.remove('fade');
    await sleep(300);
  }

  async function loop() { var tk = ++token; while (tk === token) await play(tk); }
  function start() { if (!running) { running = true; loop(); } }
  function stop() { if (running) { running = false; token++; stage.classList.remove('fade'); page.innerHTML = html; resetScenes(); goto(0, true); } }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var m = /^#(stop(\d)|art|ev|blade|edit|gen)$/.exec(location.hash);
  if (reduce || m) { var st0 = stops(); if (m && m[2]) goto(st0[+m[2]], true); else if (m) showStatic(m[1]); return; }
  if (EMBED) {
    var heard = false;
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.ep365anim === undefined) return;
      heard = true; if (e.data.ep365anim === 'play') start(); else stop();
    });
    window.parent.postMessage({ ep365animReady: true }, '*');
    return;
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) start(); else stop(); }); }, { threshold: 0.35 }).observe(box);
  } else { start(); }
})();
