<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realizace školení – koncept nadstavby EP365 CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* ── Tokeny = EP365 CRM (Ep365Crm.module.scss, DS v2 sekce 10) ─────────── */
:root{
  --ep-font-display:'Manrope','Segoe UI',system-ui,sans-serif;
  --ep-font-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --ep-font-mono:'JetBrains Mono','Cascadia Code','Courier New',monospace;
  --ep-navy:#002163; --ep-text:#002163; --ep-heading-color:#002163;
  --ep-text-muted:#4A5874; --ep-text-soft:#7A8499;
  --ep-bg:#FFFFFF; --ep-bg-2:#F4F7FB; --ep-bg-3:#EAEFF6;
  --ep-line:#E0E6EF; --ep-line-strong:#C7D0DC; --ep-sidebar:#FBFCFE;
  --ep-accent:#00CED7; --ep-accent-strong:#00A8B0; --ep-accent-soft:#E4F7F6; --ep-accent-text:#002163; --ep-accent-ink:#0A5D63;
  --ep-green:#34B36A; --ep-amber:#E6A23C; --ep-red:#D14343;
  --ep-r-sm:8px; --ep-r-md:14px; --ep-r-pill:999px;
  --ep-sh-sm:0 1px 4px rgba(0,0,0,.07); --ep-sh-md:0 2px 12px rgba(0,0,0,.10); --ep-sh-lg:0 8px 28px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ep-bg-2);color:var(--ep-text);font-family:var(--ep-font-body);font-size:13.5px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--ep-accent-strong)}
/* ── Shell (jen samostatné otevření souboru; v aplikaci je schovaný) ──── */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
body.embedded .app{grid-template-columns:1fr}
body.embedded .sidebar,body.embedded .topbar{display:none}
.sidebar{background:var(--ep-sidebar);border-right:1px solid var(--ep-line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brandIcon{width:34px;height:34px;border-radius:9px;background:var(--ep-accent);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px -4px rgba(0,206,215,.4)}
.brandName{font-family:var(--ep-font-display);font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.brandKicker{font-family:var(--ep-font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ep-text-soft)}
.grp{margin:8px 0 4px}
.grpLabel{font-family:var(--ep-font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ep-text-soft);padding:10px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:none;background:none;border-radius:var(--ep-r-sm);cursor:pointer;color:var(--ep-text);font-weight:600;font-size:13.5px;text-align:left}
.nav svg{color:var(--ep-text-soft);flex-shrink:0}
.nav:hover{background:var(--ep-bg-3)}
.nav.active{background:var(--ep-accent-soft);color:var(--ep-navy)}
.nav.active svg{color:var(--ep-accent-strong)}
.nav .cnt{margin-left:auto;font-family:var(--ep-font-mono);font-size:10.5px;background:var(--ep-accent-soft);color:var(--ep-accent-ink);padding:2px 7px;border-radius:999px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--ep-bg);border-bottom:1px solid var(--ep-line);font-size:12.5px;color:var(--ep-text-soft)}
.topbar b{color:var(--ep-text);font-weight:600}
.canvas{flex:1;padding:24px;min-width:0}
/* ── PageHeader (full-bleed, DS 10.3) ─────────────────────────────────── */
.ph{background:var(--ep-bg);border-bottom:1px solid var(--ep-line);padding:22px 24px 24px;margin:-24px -24px 24px;position:relative;overflow:hidden}
.phBg{position:absolute;inset:0;opacity:.35;background-image:linear-gradient(var(--ep-line) 1px,transparent 1px),linear-gradient(90deg,var(--ep-line) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,black 30%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 0%,black 30%,transparent 80%);pointer-events:none}
.phC{position:relative}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ep-text-soft);margin-bottom:14px}
.crumbs b{color:var(--ep-text);font-weight:600}
.phRow{display:flex;align-items:flex-start;gap:16px}
.phT{flex:1;min-width:0}
.eyebrow{display:block;font-family:var(--ep-font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ep-accent-strong);margin-bottom:8px}
h1.h{font-family:var(--ep-font-display);font-size:34px;font-weight:800;color:var(--ep-heading-color);letter-spacing:-.02em;margin:0 0 10px;line-height:1.15}
h1.h .hl{display:block;color:var(--ep-accent);font-style:italic;font-family:'Fraunces',Georgia,serif;font-weight:500}
.phSub{font-size:14px;line-height:1.55;color:var(--ep-text-muted);max-width:720px;margin:0}
.phA{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
/* ── Buttons, chips, cards, tables, tabs, KPI ─────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 18px;border-radius:var(--ep-r-pill);border:none;font-family:var(--ep-font-body);font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .13s,color .13s}
.btn.primary{background:var(--ep-navy);color:#fff}.btn.primary:hover{background:#001550}
.btn.accent{background:var(--ep-accent);color:var(--ep-accent-text)}.btn.accent:hover{background:var(--ep-accent-strong)}
.btn.ghost{background:transparent;color:var(--ep-text);border:1px solid var(--ep-line)}.btn.ghost:hover{background:var(--ep-bg-2)}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.green{background:#E5F7EE;color:#1A7A44}.chip.amber{background:#FEF3DD;color:#8A5A00}.chip.navy{background:var(--ep-bg-3);color:var(--ep-text)}
.chip.accent{background:var(--ep-accent-soft);color:var(--ep-accent-strong)}.chip.red{background:#FEEAEA;color:#9C2C2C}.chip.ghost{background:transparent;border:1px solid var(--ep-line);color:var(--ep-text-muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
.card{background:var(--ep-bg);border:1px solid var(--ep-line);border-radius:var(--ep-r-md);box-shadow:var(--ep-sh-sm)}
.pad{padding:22px 24px}.tight{padding:14px 18px}
.cardH{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cardT{font-family:var(--ep-font-display);font-weight:800;font-size:15px;letter-spacing:-.01em;margin:0}
.kick{font-family:var(--ep-font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ep-text-soft)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t thead tr{border-bottom:1px solid var(--ep-line)}
table.t th{padding:10px 14px;text-align:left;font-family:var(--ep-font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ep-text-soft);font-weight:700;white-space:nowrap}
table.t tbody tr{border-bottom:1px solid var(--ep-line);transition:background .1s}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr:hover{background:var(--ep-bg-2)}
table.t tbody tr:last-child{border-bottom:none}
table.t td{padding:11px 14px;vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--ep-font-mono);font-size:12.5px}
.tabs{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--ep-line);background:var(--ep-bg);font-size:13px;font-weight:600;color:var(--ep-text-muted);cursor:pointer}
.tab .n{font-family:var(--ep-font-mono);font-size:10px;opacity:.65}
.tab:hover{border-color:var(--ep-line-strong);color:var(--ep-text)}
.tab.on{background:var(--ep-text);border-color:var(--ep-text);color:#fff}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.inp{height:36px;padding:0 12px;border:1px solid var(--ep-line-strong);border-radius:var(--ep-r-sm);background:var(--ep-bg);min-width:200px;outline:none}
.sel{height:36px;padding:0 10px;border:1px solid var(--ep-line-strong);border-radius:var(--ep-r-sm);background:var(--ep-bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.kpi{background:var(--ep-bg);border:1px solid var(--ep-line);border-radius:var(--ep-r-md);padding:18px 20px;box-shadow:var(--ep-sh-sm)}
.kpiL{font-family:var(--ep-font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ep-text-soft);margin-bottom:8px}
.kpiV{font-family:var(--ep-font-display);font-size:28px;font-weight:800;color:var(--ep-text);letter-spacing:-.02em;line-height:1}
.kpiS{font-size:12px;color:var(--ep-text-soft);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}.phRow{flex-direction:column}.phA{justify-content:flex-start}}
@media (max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}h1.h{font-size:26px}.kpis{grid-template-columns:repeat(2,1fr)}}
.muted{color:var(--ep-text-muted)}.soft{color:var(--ep-text-soft)}.mono{font-family:var(--ep-font-mono);font-size:12px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ep-line)}
.list li:last-child{border-bottom:none}
.bar{height:8px;background:var(--ep-bg-3);border-radius:999px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ep-accent);border-radius:999px}
.bar i.warn{background:var(--ep-amber)}.bar i.over{background:var(--ep-red)}
.av{display:grid;place-items:center;border-radius:50%;width:30px;height:30px;font-family:var(--ep-font-display);font-weight:700;font-size:10.5px;color:#fff;background:var(--ep-accent-strong);flex-shrink:0}
.av.b{background:#3B82F6}.av.c{background:#8B5CF6}.av.d{background:#F59E0B}.av.e{background:#EC4899}.av.f{background:#6366F1}
.empty{padding:26px;text-align:center;color:var(--ep-text-soft)}
.note{background:var(--ep-accent-soft);border:1px solid #CCF5F7;color:#002B7A;border-radius:var(--ep-r-sm);padding:10px 14px;font-size:12.5px;margin:0 0 18px}
.warnb{background:#FCF1DD;border:1px solid #F5DCA8;color:#6B4708;border-radius:var(--ep-r-sm);padding:10px 14px;font-size:12.5px;margin:0 0 18px}
/* ── Kalendář obsazenosti ──────────────────────────────────────────────── */
.calWrap{overflow-x:auto;border:1px solid var(--ep-line);border-radius:var(--ep-r-md);background:var(--ep-bg)}
table.cal{border-collapse:separate;border-spacing:0;font-size:11.5px}
table.cal th,table.cal td{border-bottom:1px solid var(--ep-line);border-right:1px solid var(--ep-line);padding:0;height:34px}
table.cal th.row,table.cal td.row{position:sticky;left:0;background:var(--ep-bg);z-index:2;min-width:230px;padding:0 12px;text-align:left;font-weight:600;white-space:nowrap;box-shadow:2px 0 0 var(--ep-line)}
table.cal td.row small{display:block;font-weight:400;color:var(--ep-text-soft);font-size:11px}
table.cal th.day{min-width:27px;width:27px;font-family:var(--ep-font-mono);font-weight:500;color:var(--ep-text-soft);text-align:center;font-size:10px;line-height:1.1;background:var(--ep-bg);position:sticky;top:0;z-index:1}
table.cal th.day small{display:block;font-size:9px;opacity:.7}
table.cal th.mon{background:var(--ep-bg-2);text-align:left;padding:6px 12px;font-family:var(--ep-font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ep-text-muted)}
table.cal .we{background:var(--ep-bg-2)}
table.cal .today{box-shadow:inset 0 0 0 2px var(--ep-accent)}
table.cal .msep{border-left:3px solid var(--ep-line-strong)}
table.cal td.c{text-align:center;cursor:pointer;font-family:var(--ep-font-mono);font-size:10px;font-weight:700;color:#fff;letter-spacing:.02em}
table.cal td.c.p-lto{background:var(--ep-accent);color:var(--ep-navy)}
table.cal td.c.p-ltf{background:var(--ep-navy)}
table.cal td.c.p-mt{background:var(--ep-amber);color:#3d2a00}
table.cal td.c.p-ht{background:var(--ep-green)}
table.cal td.c.p-off{background:repeating-linear-gradient(45deg,#EAEFF6,#EAEFF6 4px,#fff 4px,#fff 8px);color:var(--ep-text-soft)}
table.cal td.c:hover{filter:brightness(.92)}
table.cal td.cnt{text-align:center;font-family:var(--ep-font-mono);font-size:10.5px;color:var(--ep-text-muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ep-text-muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
/* ── Stavový pás zakázky ───────────────────────────────────────────────── */
.steps{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:92px;padding:8px 10px;border-radius:var(--ep-r-sm);background:var(--ep-bg-3);font-size:11.5px;font-weight:600;color:var(--ep-text-soft);text-align:center;position:relative}
.step.done{background:var(--ep-accent-soft);color:var(--ep-accent-ink)}
.step.cur{background:var(--ep-navy);color:#fff}
.step small{display:block;font-family:var(--ep-font-mono);font-size:9.5px;font-weight:500;opacity:.8}
/* ── Drawer ───────────────────────────────────────────────────────────── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:50;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:640px;max-width:96vw;background:var(--ep-bg);border-left:1px solid var(--ep-line);box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:51;display:none;flex-direction:column}
body.drawerOpen .backdrop{display:block}body.drawerOpen .drawer{display:flex}
.dH{padding:18px 22px 14px;border-bottom:1px solid var(--ep-line);display:flex;gap:12px;align-items:flex-start}
.dH h2{font-family:var(--ep-font-display);font-size:19px;font-weight:800;margin:4px 0 6px;letter-spacing:-.01em}
.dB{flex:1;overflow-y:auto;padding:18px 22px}
.dF{padding:12px 22px;border-top:1px solid var(--ep-line);display:flex;gap:10px;flex-wrap:wrap;background:var(--ep-bg)}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--ep-line);background:var(--ep-bg);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0 0 6px}
.fact b{display:block;font-family:var(--ep-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ep-text-soft);font-weight:500;margin-bottom:2px}
.fact span{font-weight:600}
.fact.full{grid-column:1/-1}
.sec{margin:18px 0 0}
.secT{font-family:var(--ep-font-display);font-weight:800;font-size:14px;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--ep-line)}
.chk li:last-child{border-bottom:none}
.box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ep-line-strong);display:grid;place-items:center;flex-shrink:0;font-size:11px;color:#fff}
.box.on{background:var(--ep-green);border-color:var(--ep-green)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--ep-line)}
.tl li{position:relative;padding:4px 0 10px 12px;font-size:12.5px}
.tl li:before{content:'';position:absolute;left:-19px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--ep-accent)}
.tl small{display:block;font-family:var(--ep-font-mono);font-size:10.5px;color:var(--ep-text-soft)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
.sw i{width:34px;height:20px;border-radius:999px;background:var(--ep-line-strong);position:relative;transition:background .13s}
.sw i:after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .13s}
.sw.on i{background:var(--ep-accent-strong)}.sw.on i:after{left:16px}
.price{font-family:var(--ep-font-mono)}
.hidden{display:none !important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ep-navy);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.roleBox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ep-text-soft)}
.concept{font-family:var(--ep-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ep-text-soft);border:1px dashed var(--ep-line-strong);padding:3px 8px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
      <div><div class="brandName">EP365 CRM</div><div class="brandKicker">Realizace</div></div>
    </div>
    <div class="grp">
      <button class="nav" data-crm="dashboard">${ic('dash')}Dashboard</button>
      <button class="nav" data-crm="activity">${ic('act')}Aktivita</button>
    </div>
    <div class="grp"><div class="grpLabel">CRM</div>
      <button class="nav" data-crm="contacts">${ic('user')}Kontakty<span class="cnt">25</span></button>
      <button class="nav" data-crm="companies">${ic('bld')}Firmy<span class="cnt">24</span></button>
      <button class="nav" data-crm="deals">${ic('deal')}Nabídky</button>
      <button class="nav" data-crm="invoices">${ic('doc')}Faktury</button>
      <button class="nav" data-crm="tasks">${ic('chk')}Úkoly</button>
    </div>
    <div class="grp"><div class="grpLabel">Akce</div>
      <button class="nav" data-crm="events">${ic('cal')}Konference &amp; akce</button>
      <button class="nav" data-crm="webinars">${ic('mic')}Webináře</button>
    </div>
    <div class="grp"><div class="grpLabel">Realizace školení</div>
      <button class="nav" data-go="prehled">${ic('dash')}Přehled realizace</button>
      <button class="nav" data-go="kalendar">${ic('cal')}Kalendář obsazenosti</button>
      <button class="nav" data-go="zakazky">${ic('list')}Zakázky</button>
      <button class="nav" data-go="fakturace">${ic('doc')}K fakturaci</button>
      <button class="nav" data-go="lektori">${ic('users')}Lektoři</button>
    </div>
    <div class="grp"><div class="grpLabel">Systém</div>
      <button class="nav" data-crm="templates">${ic('mail')}Šablony e-mailu</button>
      <button class="nav" data-crm="campaigns">${ic('send')}Kampaně</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">EP365 CRM &rsaquo; <b id="tbTitle">Realizace školení</b><span style="margin-left:auto" class="concept">koncept · klikací návrh</span></div>
    <div class="canvas" id="canvas"></div>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Koncept „Realizace školení“ – nadstavba nad EP365 CRM.

  return '<header class="ph"><div class="phBg"></div><div class="phC"><div class="crumbs">EP365 CRM &rsaquo; Realizace školení &rsaquo; <b>'+esc(title)+'</b></div>'+
    '<div class="phRow"><div class="phT"><span class="eyebrow">'+esc(eyebrow)+'</span><h1 class="h">'+esc(title)+(hl?'<span class="hl">'+esc(hl)+'</span>':'')+'</h1><p class="phSub">'+sub+'</p></div>'+
    '<div class="phA">'+roleSel+(actions||'')+'</div></div></div></header>';
}
function setRole(r){ S.role=r; if(role().screens.indexOf(S.screen)===-1) S.screen=role().screens[0]; closeDrawer(); render(); }

/* ── Vykreslení ───────────────────────────────────────────────────────── */
function render(){
  var c=document.getElementById('canvas');
  var scr=S.screen;
  if(role().screens.indexOf(scr)===-1){ c.innerHTML=header('REALIZACE ŠKOLENÍ',TITLES[scr]||'','','')+'<div class="card pad empty">Tuto obrazovku role '+esc(role().label)+' nevidí.</div>'; return; }
  document.querySelectorAll('.sidebar .nav').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-go')===scr); });
  document.getElementById('tbTitle').textContent=TITLES[scr];
  var tabs='';
  if(!S.embedded){ tabs='<div class="tabs">'+Object.keys(TITLES).filter(function(k){ return role().screens.indexOf(k)!==-1; }).map(function(k){ return '<button class="tab'+(k===scr?' on':'')+'" onclick="go(\''+k+'\')">'+esc(TITLES[k])+'</button>'; }).join('')+'</div>'; }
  c.innerHTML=({prehled:renderDash,kalendar:renderCal,zakazky:renderOrders,fakturace:renderBilling,lektori:renderLectors})[scr](tabs);
}

/* Přehled realizace */
function renderDash(tabs){
  var r=role(); var os=visibleOrders();
  var thisMonth=os.filter(function(o){ return o.status!=='Odloženo' && daysIn(o,0).length>0; });
  var week=[]; os.forEach(function(o){ o.days.forEach(function(x){ if(inWeek(x) && o.status!=='Odloženo') week.push({o:o,x:x}); }); }); week.sort(function(a,b){ return a.x-b.x; });
  var usedDays=0, capDays=0; LECTORS.forEach(function(l){ capDays+=l.cap; usedDays+=lectorDays(l.code,0); });
  var toBill=0, toBillN=0; ORDERS.forEach(function(o){ o.milestones.forEach(function(m){ if(m.state==='lze fakturovat'){ toBill+=m.amount; toBillN++; } }); });
  var overdue=CRM_INVOICES.filter(function(i){ return i.state==='po splatnosti'; }); var overdueSum=overdue.reduce(function(a,i){ return a+i.amount; },0);
  var expected=0; ORDERS.forEach(function(o){ o.milestones.forEach(function(m){ if(m.duzp.getMonth()===M && m.duzp.getFullYear()===Y && m.state!=='zaplaceno') expected+=m.amount; }); });
  var missing=[]; os.forEach(function(o){ var nd=nextDay(o); if(!nd || o.status==='Odloženo') return; o.materials.forEach(function(m){ if(!m[1]) missing.push({o:o,what:m[0],nd:nd,kind:'lektor'}); }); o.logistics.forEach(function(m){ if(!m[1]) missing.push({o:o,what:m[0],nd:nd,kind:'zajištění'}); }); });
  missing.sort(function(a,b){ return a.nd-b.nd; });
  var evalWait=os.filter(function(o){ return (o.status==='Vyhodnocení' || (o.status==='Realizace' && !nextDay(o))) && !o.eval; });
  var h=header('REALIZACE ŠKOLENÍ','Přehled realizace','Kde jsme dnes.','Školení tento měsíc, vytížení lektorů, co chybí před termínem a co je připravené k fakturaci. Čísla ze zakázek i z CRM (nabídky, faktury) na jednom místě.',
    r.edit?'<button class="btn accent" onclick="toast(\'V hotové aplikaci: průvodce novou zakázkou (klient z CRM, nabídka, termíny, lektor)\')">'+ic('plus')+' Nová zakázka</button>':'');
  h+=tabs;
  h+='<div class="kpis">'+
    '<div class="kpi"><div class="kpiL">Školení tento měsíc</div><div class="kpiV">'+thisMonth.length+'</div><div class="kpiS">'+thisMonth.reduce(function(a,o){ return a+daysIn(o,0).length; },0)+' školicích dnů · '+MONTHS[M]+'</div></div>'+
    '<div class="kpi"><div class="kpiL">Vytížení lektorů</div><div class="kpiV">'+Math.round(usedDays/capDays*100)+' %</div><div class="kpiS">'+usedDays+' z '+capDays+' dnů kapacity</div></div>'+
    (r.cash?'<div class="kpi"><div class="kpiL">Lze fakturovat teď</div><div class="kpiV">'+money(toBill)+'</div><div class="kpiS">'+toBillN+' milníky uvolněné obchodníkem</div></div>':'')+
    (r.cash?'<div class="kpi"><div class="kpiL">Po splatnosti</div><div class="kpiV" style="color:var(--ep-red)">'+money(overdueSum)+'</div><div class="kpiS">'+overdue.length+' faktury · z CRM</div></div>':'')+
    (r.cash?'<div class="kpi"><div class="kpiL">Očekáváno tento měsíc</div><div class="kpiV">'+money(expected)+'</div><div class="kpiS">milníky s DUZP v '+MONTHS[M]+'</div></div>':'')+
    '</div>';
  h+='<div class="grid3"><div class="card pad"><div class="cardH"><div><div class="kick">Tento týden</div><h3 class="cardT">Školení a setkání</h3></div><button class="btn ghost sm" onclick="go(\'kalendar\')">'+ic('cal')+' Kalendář</button></div>';
  if(!week.length) h+='<div class="empty">Tento týden nic neběží.</div>';
  else h+='<table class="t"><thead><tr><th>Den</th><th>Školení</th><th>Klient</th><th>Lektor</th><th>Stav</th></tr></thead><tbody>'+week.map(function(w){ return '<tr class="click" onclick="openDrawer(\''+w.o.id+'\')"><td class="mono">'+DAYS[w.x.getDay()]+' '+fmt(w.x)+'</td><td><b>'+esc(w.o.topic)+'</b><br><span class="soft">'+esc(w.o.place)+'</span></td><td>'+esc(w.o.client)+'</td><td>'+lchips(w.o.lectors)+'</td><td>'+schip(w.o.status)+'</td></tr>'; }).join('')+'</tbody></table>';
  h+='</div><div class="card pad"><div class="cardH"><div><div class="kick">'+MONTHS[M]+'</div><h3 class="cardT">Vytížení lektorů</h3></div><button class="btn ghost sm" onclick="go(\'lektori\')">Lektoři</button></div><ul class="list">'+LECTORS.map(function(l){ var u=lectorDays(l.code,0); var pct=Math.round(u/l.cap*100); return '<li><span class="av '+l.av+'">'+l.code+'</span><span style="min-width:120px">'+esc(l.name)+'</span><span class="bar"><i class="'+(pct>100?'over':pct>85?'warn':'')+'" style="width:'+Math.min(100,pct)+'%"></i></span><span class="mono" style="min-width:64px;text-align:right">'+u+' / '+l.cap+' d</span></li>'; }).join('')+'</ul></div></div>';
  h+='<div class="grid2"><div class="card pad"><div class="cardH"><div><div class="kick">Před termínem</div><h3 class="cardT">Chybí podklady a zajištění</h3></div></div>';
  h+=missing.length?'<ul class="list">'+missing.slice(0,7).map(function(m){ return '<li style="cursor:pointer" onclick="openDrawer(\''+m.o.id+'\')"><span class="chip '+(m.kind==='lektor'?'amber':'navy')+'">'+m.kind+'</span><span><b>'+esc(m.what)+'</b><br><span class="soft">'+esc(m.o.topic)+' · '+esc(m.o.client)+'</span></span><span class="mono" style="margin-left:auto;color:'+((m.nd-TODAY)/864e5<3?'var(--ep-red)':'var(--ep-text-soft)')+'">do '+fmt(m.nd)+'</span></li>'; }).join('')+'</ul>':'<div class="empty">Vše připraveno.</div>';
  h+='</div><div class="card pad"><div class="cardH"><div><div class="kick">Po školení</div><h3 class="cardT">Vyhodnocení a fakturace</h3></div>'+(r.cash?'<button class="btn ghost sm" onclick="go(\'fakturace\')">K fakturaci</button>':'')+'</div><ul class="list">';
  h+=evalWait.map(function(o){ return '<li style="cursor:pointer" onclick="openDrawer(\''+o.id+'\')"><span class="chip amber">vyhodnocení</span><span><b>'+esc(o.topic)+'</b><br><span class="soft">'+esc(o.client)+' · proběhlo '+fmt(o.days[o.days.length-1])+'</span></span></li>'; }).join('');
  ORDERS.forEach(function(o){ o.milestones.forEach(function(m){ if(m.state==='lze fakturovat') h+='<li style="cursor:pointer" onclick="openDrawer(\''+o.id+'\')"><span class="chip green">lze fakturovat</span><span><b>'+esc(m.name)+'</b><br><span class="soft">'+esc(o.client)+' · DUZP '+fmt(m.duzp)+'</span></span>'+(r.prices?'<span class="mono" style="margin-left:auto">'+money(m.amount)+'</span>':'')+'</li>'; }); });
  if(!evalWait.length && !toBillN) h+='<li class="soft">Nic nečeká.</li>';
  h+='</ul></div></div>';
  h+='<div class="card pad"><div class="cardH"><div><div class="kick">Můj týden</div><h3 class="cardT">Úkoly</h3></div><button class="btn ghost sm" onclick="crm(\'tasks\')">Všechny úkoly v CRM</button></div><ul class="chk">'+TASKS.map(function(t){ return '<li><span class="box'+(t.done?' on':'')+'">'+(t.done?'✓':'')+'</span><span class="mono soft" style="min-width:52px">'+fmt(t.when)+'</span><span'+(t.done?' style="text-decoration:line-through;color:var(--ep-text-soft)"':'')+'>'+esc(t.text)+'</span><span class="soft" style="margin-left:auto">'+esc(t.who)+'</span></li>'; }).join('')+'</ul></div>';
  return h;
}
function lectorDays(code,mo){ var n=0; ORDERS.forEach(function(o){ if(o.status==='Odloženo' || o.lectors.indexOf(code)===-1) return; n+=daysIn(o,mo).length; }); return n; }

/* Kalendář obsazenosti */
function renderCal(tabs){
  var r=role();
  var h=header('REALIZACE ŠKOLENÍ','Kalendář obsazenosti','Kdo, kdy, kde.','Dva měsíce vedle sebe, tlustá čára mezi nimi. Barva políčka = typ produktu, zkratka = lektor. Kliknutím na políčko otevřete zakázku. Řádky lze přepnout na lektory, ať je vidět kapacita a mezery.',
    '<div class="legend">'+Object.keys(PRODUCT).map(function(p){ return '<span><i class="'+PRODUCT[p].cls+'" style="background:'+({'p-lto':'var(--ep-accent)','p-ltf':'var(--ep-navy)','p-mt':'var(--ep-amber)','p-ht':'var(--ep-green)'})[PRODUCT[p].cls]+'"></i>'+esc(p)+'</span>'; }).join('')+'<span><i style="background:repeating-linear-gradient(45deg,#EAEFF6,#EAEFF6 3px,#fff 3px,#fff 6px);border:1px solid var(--ep-line)"></i>odloženo</span></div>');
  h+=tabs;
  h+='<div class="toolbar"><button class="btn ghost sm" onclick="S.calMonth--;render()">'+ic('left')+'</button><b style="font-family:var(--ep-font-display);font-size:15px;min-width:210px;text-align:center">'+MONTHS[(M+S.calMonth+12)%12]+' – '+MONTHS[(M+S.calMonth+13)%12]+' '+new Date(Y,M+S.calMonth,1).getFullYear()+'</b><button class="btn ghost sm" onclick="S.calMonth++;render()">'+ic('right')+'</button><button class="btn ghost sm" onclick="S.calMonth=0;render()">Dnes</button>'+
    '<span style="margin-left:8px" class="soft">Řádky:</span>'+['zakazky','lektori','produkty'].map(function(k){ return '<button class="tab'+(S.calRows===k?' on':'')+'" onclick="S.calRows=\''+k+'\';render()">'+({zakazky:'Zakázky',lektori:'Lektoři',produkty:'Produkty'})[k]+'</button>'; }).join('')+
    '<select class="sel" onchange="S.calProduct=this.value;render()"><option value="">Všechny produkty</option>'+Object.keys(PRODUCT).map(function(p){ return '<option'+(S.calProduct===p?' selected':'')+'>'+p+'</option>'; }).join('')+'</select>'+
    (r.own?'':'<select class="sel" onchange="S.calLector=this.value;render()"><option value="">Všichni lektoři</option>'+LECTORS.map(function(l){ return '<option value="'+l.code+'"'+(S.calLector===l.code?' selected':'')+'>'+l.code+' · '+esc(l.name)+'</option>'; }).join('')+'</select>')+'</div>';
  var months=[S.calMonth,S.calMonth+1];
  var cols=[]; months.forEach(function(mo,mi){ var first=new Date(Y,M+mo,1); var n=new Date(Y,M+mo+1,0).getDate(); for(var i=1;i<=n;i++) cols.push({date:new Date(first.getFullYear(),first.getMonth(),i),sep:mi>0&&i===1,mo:mo}); });
  var os=visibleOrders().filter(function(o){ return (!S.calProduct||o.product===S.calProduct) && (!S.calLector||o.lectors.indexOf(S.calLector)!==-1); });
  var rows=[];
  if(S.calRows==='zakazky'){ os.forEach(function(o){ if(o.days.some(function(x){ return cols.some(function(c){ return sameDay(c.date,x); }); })) rows.push({label:o.topic,sub:o.client,cell:function(c){ return o.days.some(function(x){ return sameDay(x,c.date); })?{o:o,text:o.lectors.join('+')}:null; }}); }); }
  else if(S.calRows==='lektori'){ LECTORS.filter(function(l){ return !r.own||l.code===r.own; }).forEach(function(l){ rows.push({label:l.code+' · '+l.name,sub:l.type+' · kapacita '+l.cap+' d/měs',cell:function(c){ var hit=null; os.forEach(function(o){ if(o.lectors.indexOf(l.code)!==-1 && o.days.some(function(x){ return sameDay(x,c.date); })) hit={o:o,text:o.id.slice(-2)}; }); return hit; }}); }); }
  else { Object.keys(PRODUCT).forEach(function(p){ rows.push({label:p,sub:PRODUCT[p].desc,count:function(c){ var n=0; os.forEach(function(o){ if(o.product===p && o.status!=='Odloženo' && o.days.some(function(x){ return sameDay(x,c.date); })) n++; }); return n; }}); }); }
  h+='<div class="calWrap"><table class="cal"><thead><tr><th class="row mon">'+(S.calRows==='zakazky'?'Zakázka · klient':S.calRows==='lektori'?'Lektor':'Produkt')+'</th>';
  months.forEach(function(mo,mi){ var n=new Date(Y,M+mo+1,0).getDate(); h+='<th class="mon'+(mi>0?' msep':'')+'" colspan="'+n+'">'+MONTHS[(M+mo+12)%12]+' '+new Date(Y,M+mo,1).getFullYear()+'</th>'; });
  h+='</tr><tr><th class="row" style="top:auto"></th>'+cols.map(function(c){ var we=c.date.getDay()===0||c.date.getDay()===6; return '<th class="day'+(we?' we':'')+(c.sep?' msep':'')+(sameDay(c.date,TODAY)?' today':'')+'">'+c.date.getDate()+'<small>'+DAYS[c.date.getDay()]+'</small></th>'; }).join('')+'</tr></thead><tbody>';
  if(!rows.length) h+='<tr><td class="row">Nic k zobrazení</td>'+cols.map(function(c){ return '<td class="'+((c.date.getDay()%6===0)?'we':'')+'"></td>'; }).join('')+'</tr>';
  rows.forEach(function(row){ h+='<tr><td class="row">'+esc(row.label)+'<small>'+esc(row.sub)+'</small></td>'+cols.map(function(c){ var we=c.date.getDay()===0||c.date.getDay()===6; var cls=(we?'we':'')+(c.sep?' msep':'')+(sameDay(c.date,TODAY)?' today':''); if(row.count){ var n=row.count(c); return '<td class="cnt '+cls+'">'+(n||'')+'</td>'; } var hit=row.cell(c); if(!hit) return '<td class="'+cls+'"></td>'; var pc=hit.o.status==='Odloženo'?'p-off':PRODUCT[hit.o.product].cls; return '<td class="c '+pc+' '+cls+'" title="'+esc(hit.o.topic+' · '+hit.o.client+' · '+hit.o.lectors.join(', '))+'" onclick="openDrawer(\''+hit.o.id+'\')">'+esc(hit.text)+'</td>'; }).join('')+'</tr>'; });
  h+='</tbody></table></div>';
  if(S.calRows==='lektori'){ h+='<p class="note" style="margin-top:14px">Řádky lektorů ukazují mezery v kapacitě. Číslo v políčku je konec kódu zakázky (např. 31 = Z-26-031).</p>'; }
  return h;
}

/* Zakázky */
function renderOrders(tabs){
  var r=role();
  var os=visibleOrders().filter(function(o){ return (!S.ordStatus||o.status===S.ordStatus) && (!S.ordProduct||o.product===S.ordProduct) && (!S.ordQuery||(o.topic+' '+o.client+' '+o.id).toLowerCase().indexOf(S.ordQuery.toLowerCase())!==-1); });
  os.sort(function(a,b){ var na=nextDay(a)||new Date(2099,0,1), nb=nextDay(b)||new Date(2099,0,1); return na-nb; });
  var counts={}; visibleOrders().forEach(function(o){ counts[o.status]=(counts[o.status]||0)+1; });
  var h=header('REALIZACE ŠKOLENÍ','Zakázky','Jedno školení, jeden list.',r.own?'Vaše školení a projektové listy bez cen. Podklady odevzdáváte přímo u zakázky.':'Každé školení má stav, termíny, lektora, projektový list a milníky fakturace. Firma, kontakt i nabídka jsou tytéž záznamy jako v CRM – nic se nepřepisuje dvakrát.',
    r.edit?'<button class="btn accent" onclick="toast(\'V hotové aplikaci: průvodce novou zakázkou\')">'+ic('plus')+' Nová zakázka</button>':'');
  h+=tabs;
  h+='<div class="tabs"><button class="tab'+(S.ordStatus===''?' on':'')+'" onclick="S.ordStatus=\'\';render()">Vše <span class="n">'+visibleOrders().length+'</span></button>'+STATUS.concat(['Odloženo']).map(function(st){ return counts[st]?'<button class="tab'+(S.ordStatus===st?' on':'')+'" onclick="S.ordStatus=\''+st+'\';render()">'+st+' <span class="n">'+counts[st]+'</span></button>':''; }).join('')+'</div>';
  h+='<div class="toolbar"><input class="inp" placeholder="Hledat zakázku, klienta…" value="'+esc(S.ordQuery)+'" oninput="S.ordQuery=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)"><select class="sel" onchange="S.ordProduct=this.value;render()"><option value="">Všechny produkty</option>'+Object.keys(PRODUCT).map(function(p){ return '<option'+(S.ordProduct===p?' selected':'')+'>'+p+'</option>'; }).join('')+'</select><span class="soft" style="margin-left:auto">'+os.length+' zakázek</span></div>';
  h+='<div class="card"><table class="t"><thead><tr><th>Zakázka</th><th>Klient</th><th>Produkt</th><th>Termín</th><th>Lektor</th><th>Stav</th><th>Podklady</th>'+(r.prices?'<th>Fakturace</th><th class="num">Cena</th>':'')+'</tr></thead><tbody>';
  if(!os.length) h+='<tr><td colspan="9" class="empty">Nic nenalezeno.</td></tr>';
  os.forEach(function(o){ var mat=o.materials.filter(function(m){ return m[1]; }).length; var paid=o.milestones.filter(function(m){ return m.state==='zaplaceno'; }).length; var rel=o.milestones.filter(function(m){ return m.state==='lze fakturovat'; }).length;
    h+='<tr class="click" onclick="openDrawer(\''+o.id+'\')"><td><span class="mono soft">'+o.id+'</span><br><b>'+esc(o.topic)+'</b></td><td>'+esc(o.client)+'</td><td>'+pchip(o.product)+'</td><td>'+esc(termText(o))+'</td><td>'+lchips(o.lectors)+'</td><td>'+schip(o.status)+'</td><td><span class="mono">'+mat+'/'+o.materials.length+'</span>'+(mat<o.materials.length && nextDay(o)?' <span class="chip amber">chybí</span>':'')+'</td>'+
      (r.prices?'<td>'+(o.milestones.length?'<span class="mono">'+paid+'/'+o.milestones.length+' zapl.</span>'+(rel?' <span class="chip green">lze fakturovat</span>':''):'<span class="soft">bez fakturace</span>')+'</td><td class="num">'+(o.price?money(o.price):'–')+'</td>':'')+'</tr>'; });
  h+='</tbody></table></div>';
  return h;
}

/* K fakturaci */
function renderBilling(tabs){
  var r=role();
  var queue=[]; var expected={}; var months=[0,1,2];
  ORDERS.forEach(function(o){ o.milestones.forEach(function(m){ if(m.state==='lze fakturovat') queue.push({o:o,m:m}); months.forEach(function(mo){ var dt=new Date(Y,M+mo,1); if(m.duzp.getMonth()===dt.getMonth() && m.duzp.getFullYear()===dt.getFullYear()){ expected[mo]=expected[mo]||{plan:0,rel:0,iss:0,paid:0}; expected[mo][m.state==='plán'?'plan':m.state==='lze fakturovat'?'rel':m.state==='vystaveno'?'iss':'paid']+=m.amount; } }); }); });
  var overdue=CRM_INVOICES.filter(function(i){ return i.state==='po splatnosti'; });
  var issued=0; ORDERS.forEach(function(o){ o.milestones.forEach(function(m){ if(m.state==='vystaveno') issued+=m.amount; }); });
  var h=header('REALIZACE ŠKOLENÍ','K fakturaci','Kdy, komu, za co.','Obchodník po vyhodnocení školení uvolní milník („lze fakturovat“). Účetní tu vidí částku, datum zdanitelného plnění a subjekt a jedním kliknutím připraví koncept ve Fakturoidu – faktura se neodešle, dokud ji nezkontroluje. Po splatnosti hlídá CRM.','');
  h+=tabs;
  h+='<div class="kpis"><div class="kpi"><div class="kpiL">Lze fakturovat teď</div><div class="kpiV">'+money(queue.reduce(function(a,q){ return a+q.m.amount; },0))+'</div><div class="kpiS">'+queue.length+' milníky</div></div><div class="kpi"><div class="kpiL">Vystaveno, nezaplaceno</div><div class="kpiV">'+money(issued)+'</div><div class="kpiS">ve splatnosti</div></div><div class="kpi"><div class="kpiL">Po splatnosti</div><div class="kpiV" style="color:var(--ep-red)">'+money(overdue.reduce(function(a,i){ return a+i.amount; },0))+'</div><div class="kpiS">'+overdue.length+' faktury · CRM</div></div><div class="kpi"><div class="kpiL">Očekáváno '+MONTHS[M]+'</div><div class="kpiV">'+money((expected[0]||{}).plan+(expected[0]||{}).rel+(expected[0]||{}).iss||0)+'</div><div class="kpiS">milníky s DUZP v měsíci</div></div></div>';
  h+='<div class="card pad" style="margin-bottom:18px"><div class="cardH"><div><div class="kick">Fronta</div><h3 class="cardT">Milníky uvolněné k fakturaci</h3></div></div>';
  h+=queue.length?'<table class="t"><thead><tr><th>Zakázka</th><th>Milník</th><th>Subjekt</th><th>DUZP</th><th>Uvolnil</th><th class="num">Částka</th><th></th></tr></thead><tbody>'+queue.map(function(q){ return '<tr><td class="click" onclick="openDrawer(\''+q.o.id+'\')"><span class="mono soft">'+q.o.id+'</span><br><b>'+esc(q.o.topic)+'</b></td><td>'+esc(q.m.name)+'</td><td>'+esc(q.o.client)+'</td><td class="mono">'+fmtY(q.m.duzp)+'</td><td>'+esc(q.m.who)+'</td><td class="num">'+money(q.m.amount)+'</td><td><button class="btn primary sm" onclick="toast(\'Koncept faktury vytvořen ve Fakturoidu – čeká na kontrolu účetní\')">Koncept ve Fakturoidu</button></td></tr>'; }).join('')+'</tbody></table>':'<div class="empty">Nic není uvolněné k fakturaci.</div>';
  h+='</div><div class="grid2"><div class="card pad"><div class="cardH"><div><div class="kick">Cash flow</div><h3 class="cardT">Očekávané příjmy po měsících</h3></div></div><ul class="list">'+months.map(function(mo){ var e=expected[mo]||{plan:0,rel:0,iss:0,paid:0}; var tot=e.plan+e.rel+e.iss+e.paid; var max=260000; return '<li><span style="min-width:90px;font-weight:600">'+MONTHS[(M+mo+12)%12]+'</span><span class="bar" style="display:flex"><i style="width:'+Math.min(100,e.paid/max*100)+'%;background:var(--ep-green);border-radius:999px 0 0 999px"></i><i style="width:'+Math.min(100,e.iss/max*100)+'%;background:var(--ep-navy);border-radius:0"></i><i style="width:'+Math.min(100,e.rel/max*100)+'%;background:var(--ep-accent);border-radius:0"></i><i style="width:'+Math.min(100,e.plan/max*100)+'%;background:var(--ep-line-strong);border-radius:0 999px 999px 0"></i></span><span class="mono" style="min-width:110px;text-align:right">'+money(tot)+'</span></li>'; }).join('')+'</ul><p class="legend" style="margin:12px 0 0"><span><i style="background:var(--ep-green)"></i>zaplaceno</span><span><i style="background:var(--ep-navy)"></i>vystaveno</span><span><i style="background:var(--ep-accent)"></i>lze fakturovat</span><span><i style="background:var(--ep-line-strong)"></i>plán</span></p></div>';
  h+='<div class="card pad"><div class="cardH"><div><div class="kick">Z CRM → Faktury</div><h3 class="cardT">Po splatnosti</h3></div><button class="btn ghost sm" onclick="crm(\'invoices\')">Otevřít Faktury</button></div><ul class="list">'+overdue.map(function(i){ return '<li><span class="chip red">'+Math.round((TODAY-i.due)/864e5)+' dní</span><span><b>'+esc(i.no)+'</b><br><span class="soft">'+esc(i.client)+' · splatnost '+fmtY(i.due)+'</span></span><span class="mono" style="margin-left:auto">'+money(i.amount)+'</span><button class="btn ghost sm" onclick="crm(\'companies\','+i.crm+')">Firma</button></li>'; }).join('')+'</ul></div></div>';
  return h;
}

/* Lektoři */
function renderLectors(tabs){
  var h=header('REALIZACE ŠKOLENÍ','Lektoři','Kapacita a podklady.','Interní i externí lektoři, jejich témata, vytížení v měsíci a co od nich před termínem chybí. Sazby vidí jen majitelky a obchodník.','');
  h+=tabs;
  h+='<div class="card"><table class="t"><thead><tr><th>Lektor</th><th>Typ</th><th>Témata</th><th>Vytížení '+MONTHS[M]+'</th><th>Nejbližší termín</th><th>Chybí podklady</th><th>Hodnocení</th></tr></thead><tbody>';
  LECTORS.forEach(function(l){ var u=lectorDays(l.code,0); var pct=Math.round(u/l.cap*100); var next=null, nextO=null, miss=0; ORDERS.forEach(function(o){ if(o.lectors.indexOf(l.code)===-1||o.status==='Odloženo') return; var nd=nextDay(o); if(nd && (!next||nd<next)){ next=nd; nextO=o; } if(nd) o.materials.forEach(function(m){ if(!m[1]) miss++; }); });
    h+='<tr class="click" onclick="S.calRows=\'lektori\';S.calLector=\''+l.code+'\';go(\'kalendar\')"><td><div style="display:flex;align-items:center;gap:10px"><span class="av '+l.av+'">'+l.code+'</span><b>'+esc(l.name)+'</b></div></td><td>'+chip(l.type==='interní'?'navy':'ghost',l.type)+'</td><td>'+l.topics.map(function(t){ return '<span class="chip accent">'+esc(t)+'</span>'; }).join(' ')+'</td><td><div style="display:flex;align-items:center;gap:10px;min-width:180px"><span class="bar"><i class="'+(pct>100?'over':pct>85?'warn':'')+'" style="width:'+Math.min(100,pct)+'%"></i></span><span class="mono">'+u+'/'+l.cap+' d</span></div></td><td>'+(next?'<b>'+fmtY(next)+'</b><br><span class="soft">'+esc(nextO.topic)+'</span>':'<span class="soft">–</span>')+'</td><td>'+(miss?'<span class="chip amber">'+miss+'</span>':'<span class="chip green">vše</span>')+'</td><td class="mono">'+ic('star')+' '+l.rating.toFixed(1)+'</td></tr>'; });
  h+='</tbody></table></div><p class="note" style="margin-top:18px">Klik na lektora otevře kalendář obsazenosti s jeho řádkem. Sazby, smlouvy a fakturace lektorů zůstávají v CRM (Smlouvy / Faktury), sem patří jen provoz.</p>';
  return h;
}

/* Detail zakázky (drawer) */
function openDrawer(id){ S.drawer=id; S.lectorView=role().own?true:false; renderDrawer(); document.body.classList.add('drawerOpen'); }
function closeDrawer(){ document.body.classList.remove('drawerOpen'); S.drawer=null; }
function toggleMat(id,i,kind){ var o=order(id); var arr=kind==='m'?o.materials:o.logistics; arr[i][1]=!arr[i][1]; renderDrawer(); toast(arr[i][1]?'Označeno jako hotové':'Označeno jako chybějící'); }
function releaseMs(id,i){ var o=order(id); var m=o.milestones[i]; if(m.state==='plán'){ m.state='lze fakturovat'; m.who='Jan Beran'; if(o.status==='Vyhodnocení') o.status='K fakturaci'; toast('Milník uvolněn k fakturaci – účetní ho uvidí ve frontě'); } else if(m.state==='lze fakturovat'){ m.state='plán'; m.who=''; toast('Uvolnění zrušeno'); } renderDrawer(); }
function setEval(id){ var o=order(id); o.eval={score:4.5,done:TODAY,note:'Vyhodnocení s klientem proběhlo (ukázka).'}; if(o.status==='Realizace'||o.status==='Vyhodnocení') o.status='Vyhodnocení'; renderDrawer(); toast('Vyhodnocení zapsáno – obchodník může uvolnit fakturaci'); }
function renderDrawer(){
  var o=order(S.drawer); if(!o) return; var r=role(); var lv=S.lectorView; var prices=r.prices && !lv;
  var idx=statusIdx(o.status);
  var h='<div class="dH"><div style="flex:1;min-width:0"><span class="mono soft">'+o.id+' · '+esc(PRODUCT[o.product].desc)+'</span><h2>'+esc(o.topic)+'</h2><div style="display:flex;gap:6px;flex-wrap:wrap">'+pchip(o.product)+schip(o.status)+'<span class="chip ghost">'+esc(o.client)+'</span></div></div><button class="x" onclick="closeDrawer()">'+ic('x')+'</button></div>';
  h+='<div class="dB">';
  if(o.status==='Odloženo') h+='<div class="warnb">Zakázka je odložená (rozhodl obchodník). Termín zůstává v kalendáři šrafovaně, dokud se neobnoví nebo nezruší.</div>';
  h+='<div class="steps">'+STATUS.map(function(st,i){ var cls=i<idx?'done':i===idx?'cur':''; var who=i<=1?'produkťačka':i===2?'lektor':i===3?'obchodník + klient':i===4?'obchodník':'účetní'; return '<div class="step '+cls+'">'+st+'<small>'+who+'</small></div>'; }).join('')+'</div>';
  h+='<div class="secT">Termíny a lidé'+(!r.own?'<label class="sw'+(lv?' on':'')+'" onclick="S.lectorView=!S.lectorView;renderDrawer()"><i></i>Verze pro lektora</label>':'')+'</div>';
  h+='<div class="facts"><div class="fact full"><b>Termíny</b><span>'+o.days.map(function(x){ return '<span class="chip '+(x<TODAY?'green':'navy')+'">'+DAYS[x.getDay()]+' '+fmtY(x)+'</span>'; }).join(' ')+'</span></div><div class="fact"><b>Místo</b><span>'+esc(o.place)+'</span></div><div class="fact"><b>Lektor</b><span>'+o.lectors.map(function(c){ return esc(lect(c).name); }).join(', ')+'</span></div><div class="fact"><b>Produkťačka</b><span>'+esc(PM[o.pm])+'</span></div><div class="fact"><b>Obchodník</b><span>'+esc(o.sales)+'</span></div><div class="fact"><b>Účastníci</b><span>'+o.part+' / '+o.cap+'</span></div><div class="fact"><b>Kontakt klienta</b><span>'+esc(o.contact)+' <a href="#" onclick="crm(\'contacts\','+o.contactId+');return false" title="Otevřít v CRM">'+ic('link')+'</a></span></div></div>';
  h+='<div class="sec"><div class="secT">Projektový list <span class="soft" style="font-weight:400;font-size:12px">'+(lv?'bez cen – to, co vidí lektor':'úplný – produkťačka, obchodník, majitelky')+'</span></div><div class="card tight">';
  h+='<div class="facts"><div class="fact full"><b>Cíl školení</b><span>Účastníci si odnesou konkrétní postupy pro '+esc(o.topic.toLowerCase())+' a akční plán na 30 dní.</span></div><div class="fact full"><b>Program</b><span>Blok 1 – úvod a diagnostika · Blok 2 – nácvik na situacích z praxe klienta · Blok 3 – akční plán a závazky</span></div>'+(prices?'<div class="fact"><b>Cena bez DPH</b><span class="price">'+(o.price?money(o.price):'bez fakturace')+'</span></div><div class="fact"><b>Nabídka v CRM</b><span>'+(o.deal?'<a href="#" onclick="crm(\'deals\','+o.deal+');return false">N-26-'+(100+o.deal)+' '+ic('link')+'</a>':'–')+'</span></div>':'')+'</div>';
  h+='<div class="secT" style="margin-top:10px;font-size:13px">Podklady od lektora</div><ul class="chk">'+(o.materials.length?o.materials.map(function(m,i){ return '<li'+(r.edit||r.own?' style="cursor:pointer" onclick="toggleMat(\''+o.id+'\','+i+',\'m\')"':'')+'><span class="box'+(m[1]?' on':'')+'">'+(m[1]?'✓':'')+'</span>'+esc(m[0])+'</li>'; }).join(''):'<li class="soft">Zatím nic nevyžádáno.</li>')+'</ul>';
  if(!lv) h+='<div class="secT" style="margin-top:10px;font-size:13px">Zajištění (produkťačka)</div><ul class="chk">'+(o.logistics.length?o.logistics.map(function(m,i){ return '<li'+(r.edit?' style="cursor:pointer" onclick="toggleMat(\''+o.id+'\','+i+',\'l\')"':'')+'><span class="box'+(m[1]?' on':'')+'">'+(m[1]?'✓':'')+'</span>'+esc(m[0])+'</li>'; }).join(''):'<li class="soft">Nic k zajištění.</li>')+'</ul>';
  h+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" onclick="toast(\'V hotové aplikaci: otevře dokument ze šablony ve složce zakázky (SharePoint, verze bez cen pro lektora)\')">'+ic('doc')+' Otevřít projektový list (dokument)</button>'+(r.edit&&!lv?'<button class="btn ghost sm" onclick="toast(\'Odesláno lektorovi: e-mail s odkazem na jeho verzi listu\')">'+ic('send')+' Poslat lektorovi</button>':'')+'</div></div></div>';
  if(!lv){
    h+='<div class="sec"><div class="secT">Vyhodnocení s klientem</div>';
    h+=o.eval?'<div class="card tight"><div class="facts"><div class="fact"><b>Hodnocení lektora</b><span>'+ic('star')+' '+o.eval.score.toFixed(1)+' / 5</span></div><div class="fact"><b>Provedeno</b><span>'+fmtY(o.eval.done)+'</span></div>'+(o.eval.note?'<div class="fact full"><b>Poznámka</b><span style="font-weight:400">'+esc(o.eval.note)+'</span></div>':'')+'</div></div>':'<div class="card tight" style="display:flex;align-items:center;gap:12px"><span class="soft" style="flex:1">'+(nextDay(o)?'Proběhne po posledním termínu ('+fmtY(o.days[o.days.length-1])+').':'Školení proběhlo, vyhodnocení s klientem ještě nebylo zapsáno – fakturaci to blokuje.')+'</span>'+(r.edit&&!nextDay(o)?'<button class="btn primary sm" onclick="setEval(\''+o.id+'\')">Zapsat vyhodnocení</button>':'')+'</div>';
    h+='</div>';
    if(prices){
      h+='<div class="sec"><div class="secT">Milníky fakturace</div>';
      h+=o.milestones.length?'<div class="card tight" style="padding:0"><table class="t"><thead><tr><th>Milník</th><th>DUZP</th><th class="num">Částka</th><th>Stav</th><th></th></tr></thead><tbody>'+o.milestones.map(function(m,i){ var cls={'plán':'ghost','lze fakturovat':'accent','vystaveno':'navy','zaplaceno':'green'}[m.state]; var canRel=(r.release||r.edit) && (m.state==='plán'||m.state==='lze fakturovat'); return '<tr><td><b>'+esc(m.name)+'</b><br><span class="soft">'+esc(o.client)+'</span></td><td class="mono">'+fmtY(m.duzp)+'</td><td class="num">'+money(m.amount)+'</td><td><span class="chip '+cls+'">'+m.state+'</span>'+(m.who?'<br><span class="soft" style="font-size:11px">'+esc(m.who)+'</span>':'')+'</td><td>'+(canRel?'<label class="sw'+(m.state==='lze fakturovat'?' on':'')+'" onclick="releaseMs(\''+o.id+'\','+i+')" title="Uvolní obchodník po vyhodnocení"><i></i>Lze fakturovat</label>':'')+'</td></tr>'; }).join('')+'</tbody></table></div>':'<div class="card tight soft">Bez fakturace (otevřená akce / magnet).</div>';
      if(o.milestones.some(function(m){ return m.state==='plán'; }) && !o.eval && !nextDay(o)) h+='<p class="warnb" style="margin:10px 0 0">Uvolnit fakturaci lze až po zapsaném vyhodnocení s klientem.</p>';
      h+='</div>';
    }
    h+='<div class="sec"><div class="secT">Vazby v CRM</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" onclick="crm(\'companies\','+o.crm+')">'+ic('bld')+' '+esc(o.client)+'</button><button class="btn ghost sm" onclick="crm(\'contacts\','+o.contactId+')">'+ic('user')+' '+esc(o.contact)+'</button>'+(o.deal?'<button class="btn ghost sm" onclick="crm(\'deals\','+o.deal+')">'+ic('deal')+' Nabídka N-26-'+(100+o.deal)+'</button>':'')+'<button class="btn ghost sm" onclick="crm(\'invoices\')">'+ic('doc')+' Faktury</button></div></div>';
    h+='<div class="sec"><div class="secT">Historie</div><ul class="tl">'+o.notes.slice().reverse().map(function(n){ return '<li>'+esc(n[1])+'<small>'+fmtY(n[0])+'</small></li>'; }).join('')+'</ul></div>';
  }
  h+='</div>';
  h+='<div class="dF">'+(r.edit&&!lv?'<button class="btn primary" onclick="toast(\'V hotové aplikaci: editace zakázky (termíny, lektor, místo, kapacita)\')">Upravit</button><button class="btn ghost" onclick="toast(\'Přidán úkol do CRM → Úkoly\')">'+ic('chk')+' Úkol</button>':'')+(r.own?'<button class="btn primary" onclick="toast(\'Nahráno do složky zakázky – produkťačka dostane upozornění\')">Nahrát podklady</button>':'')+'<button class="btn ghost" style="margin-left:auto" onclick="closeDrawer()">Zavřít</button></div>';
  document.getElementById('drawer').innerHTML=h;
}
document.getElementById('backdrop').addEventListener('click', closeDrawer);
document.querySelectorAll('.sidebar .nav[data-go]').forEach(function(b){ b.addEventListener('click', function(){ go(b.getAttribute('data-go')); }); });
document.querySelectorAll('.sidebar .nav[data-crm]').forEach(function(b){ b.addEventListener('click', function(){ crm(b.getAttribute('data-crm')); }); });

/* ── Vložení do CRM: aplikace pošle ep365crm:init s parametrem obrazovky ─── */
window.addEventListener('message', function(e){
  var m=e.data; if(!m || m.type!=='ep365crm:init') return;
  S.embedded=true; S.pageParam=String(m.param||'');
  document.body.classList.add('embedded');
  var scr=PARAM_SCREEN[S.pageParam]||'prehled';
  if(m.role==='visitor') S.role='lektor';
  S.screen=scr; render();
});
render();
</script>
</body>
